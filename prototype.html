<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6e3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quizz du BAC">
<meta name="description" content="Le Quizz du BAC : du CP à la Terminale, ou 30 questions détente. Jouable hors ligne.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!--PWA-->
<title>Le Quizz du BAC</title>
<style>
  :root{
    --bg:#fff6e3; --ink:#2a2140; --card:#ffffff; --line:#2a2140; --pale:#f1e7d3;
    --blue:#2f6bff; --coral:#ff5566; --sun:#ffc531; --mint:#22cc88; --violet:#8b5cf6;
    --muted:#7a6f8c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; color:var(--ink); background:var(--bg);
       background-image:radial-gradient(var(--pale) 1.5px, transparent 1.6px);
       background-size:16px 16px; min-height:100vh;
       font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       touch-action:manipulation; overscroll-behavior:none;
       -webkit-user-select:none; user-select:none}
  input{-webkit-user-select:text; user-select:text}
  .app{max-width:430px; margin:0 auto;
       padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
               calc(34px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .card{position:relative; background:var(--card); border:3px solid var(--line);
        border-radius:18px; padding:18px; box-shadow:6px 6px 0 var(--ink)}
  h1{font-size:28px; margin:0 0 4px; letter-spacing:-.5px}
  h2{font-size:20px; margin:0 0 10px}
  .muted{color:var(--muted)}
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
  .btn{display:block; width:100%; padding:14px 16px; margin-top:12px; border-radius:14px;
       border:3px solid var(--ink); background:var(--sun); font-weight:800; text-align:center;
       box-shadow:4px 4px 0 var(--ink); transition:transform .06s, box-shadow .06s}
  .btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
  .btn.go{background:var(--blue); color:#fff}
  .btn.ghost{background:#fff}
  .btn:disabled{opacity:.45}
  .row{display:flex; gap:10px; align-items:center}
  .between{display:flex; justify-content:space-between; align-items:center; gap:10px}
  .center{text-align:center}

  /* écran-titre */
  .title-wrap{text-align:center; padding:6px 0 0}
  .game-title{font-size:15px; font-weight:800; letter-spacing:3px; text-transform:uppercase; color:var(--muted)}
  .game-title-main{font-size:44px; line-height:.95; font-weight:900; letter-spacing:-2px; margin:2px 0 0}
  .game-title-main span{display:block; color:var(--blue)}
  .scene{margin:12px auto 0; border:3px solid var(--ink); border-radius:16px; overflow:hidden;
         box-shadow:5px 5px 0 var(--ink)}
  .scene svg{display:block; width:100%; height:auto}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .hero-bob{animation:bob 1.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center}

  /* vortex : le tableau de la classe s'ouvre */
  .vortex{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
          background:rgba(42,33,64,0); animation:vgBg .5s forwards; padding:16px}
  @keyframes vgBg{to{background:rgba(42,33,64,.6)}}
  .vortex svg{width:min(92vw,430px); height:auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .swirl{transform-box:fill-box; transform-origin:center; animation:spin 1.1s linear infinite}
  @keyframes suckBoard{0%{transform:translate(0,0) scale(1); opacity:1}
                       35%{transform:translate(2px,-8px) scale(.8) rotate(40deg); opacity:1}
                       70%{transform:translate(5px,-24px) scale(.4) rotate(180deg); opacity:1}
                       100%{transform:translate(6px,-40px) scale(.04) rotate(400deg); opacity:0}}
  .sucked{animation:suckBoard 1.5s ease-in forwards; transform-box:fill-box; transform-origin:center}

  /* pop-up */
  .modal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
         background:rgba(42,33,64,.55); padding:18px}
  .modal-card{position:relative; width:100%; max-width:360px; background:#fff; border:3px solid var(--ink);
              border-radius:20px; padding:22px 18px 18px; box-shadow:7px 7px 0 var(--ink)}
  .close-x{position:absolute; top:-14px; right:-10px; width:38px; height:38px; border-radius:99px;
           background:var(--coral); border:3px solid var(--ink); color:#fff; font-size:20px;
           font-weight:900; line-height:1; box-shadow:3px 3px 0 var(--ink)}

  /* bandeau du haut */
  .hud{position:relative; text-align:center; margin:2px 0 14px}
  .hud .info{right:0; top:0}
  .hud .quit{position:absolute; left:0; top:0; font-size:13px; font-weight:800; padding:6px 12px;
             border:2px solid var(--ink); border-radius:99px; background:#fff;
             box-shadow:2px 2px 0 var(--ink); transition:transform .06s, box-shadow .06s}
  .hud .quit:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--ink)}
  .lvl{display:inline-block; font-size:26px; font-weight:900; letter-spacing:-.5px;
       padding:6px 20px; border-radius:14px; border:3px solid var(--ink);
       background:var(--violet); color:#fff; box-shadow:4px 4px 0 var(--ink)}
  .pips{display:flex; gap:5px; justify-content:center; margin:10px 0 8px}
  .pip{width:9px; height:9px; border-radius:99px; border:2px solid var(--ink); background:#fff}
  .pip.done{background:var(--mint)} .pip.now{background:var(--sun)}
  .scorebar{display:inline-flex; align-items:center; gap:8px; padding:5px 14px 5px 10px;
            border:3px solid var(--ink); border-radius:99px; background:#fff; box-shadow:3px 3px 0 var(--ink)}
  .scorebar .lbl{font-size:11px; font-weight:800; letter-spacing:1.5px; color:var(--muted)}
  .scorebar .val{font-size:24px; font-weight:900; letter-spacing:-1px}
  .risk{font-size:12px; color:var(--muted); margin-top:8px}
  .hearts{display:inline-flex; gap:3px; vertical-align:middle}

  /* timer */
  .timer{height:14px; border-radius:99px; background:var(--pale); border:3px solid var(--ink);
         overflow:hidden; margin:2px 0 6px}
  .timer > i{display:block; height:100%; background:var(--mint); transition:width .1s linear}
  .timer.low > i{background:var(--sun)} .timer.crit > i{background:var(--coral)}

  /* question */
  .subject{font-size:13px; font-weight:400; letter-spacing:2px; text-transform:uppercase; margin:16px 0 2px}
  .q{font-size:21px; font-weight:800; margin:2px 0 16px; line-height:1.3}
  input[type=text]{width:100%; padding:14px; border-radius:14px; background:#fff;
       border:3px solid var(--ink); color:var(--ink); font-size:17px; font-weight:600}
  input[type=text]:focus{outline:none; box-shadow:0 0 0 4px rgba(47,107,255,.25)}
  .mic{flex:0 0 54px; height:54px; border-radius:14px; background:#fff; border:3px solid var(--ink);
       display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:3px 3px 0 var(--ink)}
  .mic.rec{background:var(--coral); animation:pulse .9s infinite}
  @keyframes pulse{50%{opacity:.5}}
  .opt{display:block; width:100%; text-align:left; padding:13px 15px; margin-top:9px; border-radius:13px;
       background:#fff; border:3px solid var(--ink); font-weight:700; box-shadow:3px 3px 0 var(--ink);
       transition:transform .06s, box-shadow .06s}
  .opt:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
  .opt.good{background:var(--mint)} .opt.bad{background:var(--coral); color:#fff}
  .hint{font-size:13px; color:var(--muted); margin-top:12px}
  .feedback{margin-top:14px; padding:12px 14px; border-radius:13px; font-weight:700; border:3px solid var(--ink)}
  .feedback.good{background:#d8fbe9} .feedback.bad{background:#ffe0e3}
  .kv{display:flex; justify-content:space-between; padding:9px 0; border-bottom:2px dashed var(--pale)}
  .big{font-size:52px; font-weight:900; letter-spacing:-2px; line-height:1}
  ul.rules{padding-left:18px; font-size:14px} ul.rules li{margin:7px 0}
  .chip{font-size:12px; font-weight:700; padding:5px 10px; border-radius:99px;
        border:2px solid var(--ink); background:#fff; color:var(--muted)}
  .chip.on{background:var(--violet); color:#fff; border-color:var(--ink)}
  .tag{display:inline-block; font-size:12px; font-weight:800; padding:4px 10px; border-radius:99px;
       border:2px solid var(--ink); background:var(--mint)}

  /* retours */
  @keyframes popGood{0%{transform:scale(1)}35%{transform:scale(1.035) rotate(-.4deg)}100%{transform:scale(1)}}
  .pop-good{animation:popGood .5s ease-out; border-color:var(--mint); box-shadow:6px 6px 0 var(--mint)}
  @keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}
                   30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
  .pop-bad{animation:shake .5s; border-color:var(--coral); box-shadow:6px 6px 0 var(--coral)}
  @keyframes floatUp{0%{opacity:0; transform:translateY(8px)}25%{opacity:1}100%{opacity:0; transform:translateY(-30px)}}
  .gain{position:absolute; right:18px; top:10px; font-size:22px; font-weight:900;
        animation:floatUp 1.2s ease-out forwards; z-index:2}
  .gain.plus{color:#12a566} .gain.minus{color:var(--coral)}

  /* barre joueur */
  .player{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 12px;
          border:3px solid var(--ink); border-radius:99px; background:#fff; box-shadow:3px 3px 0 var(--ink);
          margin-bottom:16px}
  .player .avatar{flex:0 0 34px; height:34px; border-radius:99px; background:var(--sun);
                  border:2px solid var(--ink); overflow:hidden; display:flex; align-items:flex-end; justify-content:center}
  .player .who{flex:1; min-width:0}
  .player .name{font-weight:800; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .player .num{color:var(--muted); font-weight:700}
  .player .edit{font-size:11px; color:var(--muted); letter-spacing:.5px}
  .player .pencil{flex:0 0 auto; font-size:15px; opacity:.7}

  /* modes */
  @keyframes popIn{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
  .mode{display:block; width:100%; text-align:left; margin-top:14px; padding:0; overflow:hidden;
        border:3px solid var(--ink); border-radius:20px; background:#fff; box-shadow:6px 6px 0 var(--ink);
        transition:transform .06s, box-shadow .06s; animation:popIn .35s ease-out both}
  .mode:nth-of-type(2){animation-delay:.08s}
  .mode:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink)}
  .mode .band{display:flex; align-items:center; gap:12px; padding:14px 16px; color:#fff}
  .mode.bac .band{background:linear-gradient(120deg,#2f6bff,#7aa2ff)}
  .mode.relax .band{background:linear-gradient(120deg,#12a566,#5ddba0)}
  .mode .ico{flex:0 0 46px; height:46px; border-radius:14px; background:rgba(255,255,255,.22);
             border:2px solid rgba(255,255,255,.7); display:flex; align-items:center; justify-content:center}
  .mode .ico svg{display:block}
  .mode .ttl{flex:1}
  .mode .ttl b{display:block; font-size:20px; line-height:1.1}
  .mode .ttl small{font-size:12px; opacity:.9; font-weight:700; letter-spacing:.5px}
  .mode .body{display:block; padding:12px 16px 18px}
  .mode .body p{margin:0 0 10px; font-size:14px; color:var(--muted)}
  .rec{display:inline-block; font-size:12px; font-weight:800; padding:5px 12px; border-radius:99px;
       border:1.5px solid var(--ink); background:var(--sun); margin:2px 0 2px 2px;
       box-shadow:2px 2px 0 rgba(42,33,64,.5)}

  /* carte */
  .map{border:3px solid var(--ink); border-radius:16px; overflow:hidden; margin-top:8px;
       box-shadow:4px 4px 0 var(--ink)}
  .map svg{display:block; width:100%; height:auto; image-rendering:pixelated}
  .map text{font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

  .oops{margin-top:10px; padding:10px 12px; border:2px solid #ffb3bd; border-radius:12px;
        background:#fff4f5; color:#a3313c; font-size:12px; line-height:1.35; word-break:break-word}
  .oops .chip{display:block; margin:8px auto 0}

  /* bouton « i » et page des règles */
  .info{position:absolute; right:12px; top:12px; width:34px; height:34px; padding:0;
        display:flex; align-items:center; justify-content:center; color:var(--ink); opacity:.75}
  .info svg{width:26px; height:26px}
  .info:active{transform:translateY(1px)}
  .scroll{margin-top:12px; filter:drop-shadow(3px 4px 0 rgba(42,33,64,.16))}
  .roll{display:block; width:100%; height:auto}
  .roll.top{margin-bottom:-10px}
  .roll.bot{margin-top:-10px}
  .sheet{position:relative; padding:26px 28px 30px; text-align:left;
         font-family:Georgia,"Times New Roman",serif; color:#3a3350}
  .sheet .paper{position:absolute; left:0; top:0; width:100%; height:100%}
  .sheet-in{position:relative}
  .sheet h2{font-family:inherit; font-size:14px; letter-spacing:2.4px; text-transform:uppercase;
            color:#a9812a; margin:18px 0 5px}
  .sheet h2:first-child{margin-top:0}
  .sheet p{margin:0 0 6px; font-size:15px; line-height:1.5}
  .sheet ul{margin:4px 0 8px; padding-left:20px}
  .sheet li{font-size:15px; line-height:1.5; margin-bottom:3px}
  .sheet b{color:#2a2140}
  .sheet .seal{display:block; margin:16px auto 0}

  /* jokers : trois pastilles rondes */
  .jokers{display:flex; gap:16px; justify-content:center; margin:12px 0 2px}
  .jk{width:76px; text-align:center}
  .joker{width:58px; height:58px; margin:0 auto; display:flex; align-items:center; justify-content:center;
         border:3px solid var(--ink); border-radius:50%; box-shadow:3px 3px 0 var(--ink);
         background:radial-gradient(circle at 34% 30%, #ffe9a8 0%, #ffc531 46%, #e09b12 100%);
         transition:transform .06s, box-shadow .06s}
  .joker svg{width:30px; height:30px; display:block}
  .joker:active{transform:translate(3px,3px); box-shadow:0 0 0 var(--ink)}
  .joker:disabled{opacity:.45; box-shadow:3px 3px 0 var(--ink)}
  .jk b{display:block; margin-top:4px; font-size:12px; line-height:1.1}
  .jk small{display:block; font-size:10px; color:var(--muted); font-weight:700}
  .jk.spent .joker{background:var(--pale); filter:grayscale(.7)}
  .jk-row{display:flex; align-items:center; gap:12px; text-align:left; margin-top:12px;
          padding:10px 12px; border:3px solid var(--ink); border-radius:16px; background:#fff;
          box-shadow:4px 4px 0 var(--ink)}
  .jk-row .joker.big{flex:none}
  .jk-txt{flex:1}
  .jk-txt b{display:block; font-size:18px}
  .jk-txt small{display:block; color:var(--muted); font-size:13px}
  .jk-cost{font-weight:800; font-size:15px; white-space:nowrap}
  .jk.spent b{text-decoration:line-through}
  .opt.out{background:#ffe0e3; color:#a3313c; text-decoration:line-through; opacity:.75}

  /* écran de pause */
  .choice{display:block; width:100%; text-align:left; margin-top:12px; padding:14px 16px;
          border:3px solid var(--ink); border-radius:16px; background:#fff;
          box-shadow:4px 4px 0 var(--ink); transition:transform .06s, box-shadow .06s}
  .choice:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
  .choice b{display:block; font-size:22px; letter-spacing:-.3px; line-height:1.15}
  .choice small{display:block; margin-top:4px; color:var(--muted); font-size:13px}
  .choice.go{background:linear-gradient(120deg,#eef3ff,#fff)}
  .choice.save{background:linear-gradient(120deg,#fff6da,#fff)}
  .choice.pub{background:linear-gradient(120deg,#eafff5,#fff)}
  .choice.quit{background:linear-gradient(120deg,#ffeef0,#fff)}
  .resume{background:linear-gradient(120deg,#fff2c9,#fff8e4)}

  /* diplôme et classement */
  .diploma{border:3px solid var(--ink); border-radius:14px; overflow:hidden; box-shadow:5px 5px 0 var(--ink); margin-top:10px}
  .diploma svg{display:block; width:100%; height:auto}
  table.rank{width:100%; border-collapse:collapse; margin-top:10px; font-size:15px}
  table.rank td{padding:8px 6px; border-bottom:2px dashed var(--pale)}
  table.rank td.n{width:34px; color:var(--muted); font-weight:800}
  table.rank td.s{text-align:right; font-weight:900}
  table.rank tr.me td{background:#fff7d9}
  .rank-head{margin:16px 0 2px; font-size:13px; font-weight:800; letter-spacing:1px;
             text-transform:uppercase; color:var(--violet)}
  .rank-head:first-child{margin-top:6px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="fx"></div>

<script>/* Quiz Culture — moteur de jeu v0.3 (logique pure, sans UI)
 *
 * Deux modes :
 *   - « bac »     : parcours CP → Terminale, 1 question par matière, cœurs, bonus de classe.
 *   - « detente » : 30 questions à thèmes, difficulté croissante, aucune pénalité.
 *
 * Utilisable en Node (tests) et dans le navigateur (prototype).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.QuizEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var CONFIG = {
    questionsPerSubject: 1,   // 1 question par matière et par classe
    pointsFree: 2,
    pointsMC: 1,
    timerSeconds: 30,
    timeBuySeconds: 15,
    timeBuyCost: 1,
    mcOptions: 5,
    forceMCAfterFreeWrong: 1, // une réponse libre fausse ⇒ QCM imposé sur la suivante
    resetScope: 'level',      // une erreur de QCM renvoie au début de la classe
    timeoutPenalty: 2,        // timer expiré : −2 points, place conservée
    lives: 3,                 // cœurs : un perdu à chaque retour en début de classe
    perfectBonusPoints: 2,    // classe sans faute au primaire
    perfectBonusLife: 1,      // classe sans faute au secondaire
    bonusLifeFromLevel: 5,    // index de la 6ème : à partir de là, le bonus est une vie
    relaxQuestions: 30,       // mode détente
    relaxTiers: 3,            // 3 paliers de difficulté (10 questions chacun)
    jokerCost: 6,             // chaque joker coûte 6 points
    jokersFromLevel: 5,       // disponibles à partir de la 6ème
    jokerHideCount: 3,        // « 40/60 » : trois mauvaises réponses barrées
    resumeMinSeconds: 5       // à la reprise, on garde le temps restant, jamais moins de 5 s
  };

  // ---------------------------------------------------------------- normalisation

  function normalize(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // accents
      .replace(/\u00b2/g, '2').replace(/\u00b3/g, '3')  // exposants : cm2, 3x2
      .replace(/\u0153/g, 'oe').replace(/\u00e6/g, 'ae')  // ligatures : coeur, curriculum vitae
      .replace(/[\u2019']/g, ' ')
      .replace(/[^a-z0-9\s-]/g, ' ')                    // ponctuation
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/^(le|la|les|l|un|une|des|au|aux|en|the|a)\s+/, '')
      .trim();
  }

  function levenshtein(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    var prev = new Array(b.length + 1), cur = new Array(b.length + 1), i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur[0] = i;
      for (j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      for (j = 0; j <= b.length; j++) prev[j] = cur[j];
    }
    return prev[b.length];
  }

  function tolerance(len) { return len <= 4 ? 0 : (len <= 8 ? 1 : 2); }

  var WORD_NUMBERS = {
    zero: 0, un: 1, une: 1, deux: 2, trois: 3, quatre: 4, cinq: 5, six: 6, sept: 7,
    huit: 8, neuf: 9, dix: 10, onze: 11, douze: 12, treize: 13, quatorze: 14,
    quinze: 15, seize: 16, vingt: 20, trente: 30, quarante: 40, cinquante: 50,
    soixante: 60, cent: 100, mille: 1000
  };

  function toNumber(s) {
    // /!\ virgule et point traités AVANT normalize(), qui supprime la ponctuation
    var raw = String(s === null || s === undefined ? '' : s)
      .toLowerCase()
      .replace(/ /g, ' ')
      .replace(/(\d)\s+(\d)/g, '$1$2')     // « 3 200 » → « 3200 »
      .replace(/,/g, '.');
    var neg = /(^|\s)moins\s/.test(raw) ? -1 : 1;   // « moins 8 » vaut -8
    var m = raw.match(/-?\d+(?:\.\d+)?/);
    if (m) { var v = parseFloat(m[0]); return v < 0 ? v : neg * v; }
    var n = normalize(s);
    if (WORD_NUMBERS[n] !== undefined) return neg * WORD_NUMBERS[n];
    var parts = n.split(/[\s-]+/).filter(Boolean), total = 0, ok = parts.length > 0;
    parts.forEach(function (p) {
      if (WORD_NUMBERS[p] !== undefined) total += WORD_NUMBERS[p]; else ok = false;
    });
    return ok ? neg * total : NaN;
  }

  function bestDistance(given, list) {
    var best = Infinity, bestLen = 0;
    (list || []).forEach(function (t) {
      var target = normalize(t);
      if (!target) return;
      var d = levenshtein(given, target);
      if (d < best) { best = d; bestLen = target.length; }
    });
    return { d: best, len: bestLen };
  }

  /** Une réponse libre est-elle acceptée ? (trois garde-fous, voir DESIGN §2) */
  function checkFree(question, input) {
    var given = normalize(input);
    if (!given) return false;

    if (question.numeric) {
      var gn = toNumber(input);
      if (!isNaN(gn)) {
        for (var k = 0; k < question.accepted.length; k++) {
          var an = toNumber(question.accepted[k]);
          if (!isNaN(an) && an === gn) return true;
        }
      }
    }

    var acc = bestDistance(given, question.accepted);
    if (acc.d === 0) return true;
    if (question.strict || question.numeric) return false;
    if (acc.d > tolerance(acc.len)) return false;
    return acc.d < bestDistance(given, question.distractors).d;
  }

  // ---------------------------------------------------------------- utilitaires

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function makeOptions(state, q) {
    return shuffle([q.answer].concat(q.distractors.slice(0, state.config.mcOptions - 1)), state.rng);
  }

  function rngFor(options) {
    return options.rng || (options.seed !== undefined ? mulberry32(options.seed) : Math.random);
  }

  // ---------------------------------------------------------------- mode BAC

  function createGame(bank, options) {
    options = options || {};
    var cfg = Object.assign({}, CONFIG, options.config || {});

    var pools = {};
    bank.questions.forEach(function (q) {
      var key = q.level + '|' + q.subject;
      (pools[key] = pools[key] || []).push(q);
    });

    // les matières d'une classe = celles qui ont réellement des questions,
    // dans l'ordre global : les Sciences apparaissent donc d'elles-mêmes à partir de la 6ème
    var levelSubjects = {};
    bank.levels.forEach(function (lv) {
      levelSubjects[lv] = bank.subjects.filter(function (s) { return (pools[lv + '|' + s] || []).length > 0; });
    });

    var state = {
      mode: 'bac',
      config: cfg,
      levels: bank.levels,
      subjects: bank.subjects,
      levelSubjects: levelSubjects,
      pools: pools,
      rng: rngFor(options),
      levelIndex: options.levelIndex || 0,
      subjectIndex: 0,
      qIndex: 0,
      score: 0,
      pointsSinceCheckpoint: 0,
      lives: cfg.lives,
      classErrors: 0,           // fautes depuis le début de la classe (pour le bonus)
      levelPoints: [],          // points acquis par classe validée (rendus en cas de rétrogradation)
      seen: (options.seen || []).slice(),
      freeWrongStreak: 0,
      timeLeft: cfg.timerSeconds,
      budget: cfg.timerSeconds,     // secondes accordées pour la question en cours
      spent: 0,                     // temps de jeu cumulé, hors pauses
      jokers: { fifty: true, swap: true, pass: true },
      hiddenWrong: [],              // mauvaises réponses barrées par le joker 40/60
      current: null,
      options: [],
      finished: false,
      won: false,
      log: []
    };

    nextQuestion(state);
    return state;
  }

  function subjectsOf(state) { return state.levelSubjects[state.levels[state.levelIndex]] || []; }
  function poolKey(state) { return state.levels[state.levelIndex] + '|' + subjectsOf(state)[state.subjectIndex]; }

  /** Tire une question non vue du pool courant (anti-répétition). */
  function nextQuestion(state) {
    var pool = state.pools[poolKey(state)] || [];
    if (!pool.length) { state.current = null; state.finished = true; return null; }
    var currentId = state.current && state.current.id;
    var unseen = pool.filter(function (q) {
      return state.seen.indexOf(q.id) === -1 && q.id !== currentId;
    });
    if (!unseen.length) {
      var ids = pool.map(function (q) { return q.id; });
      var keep = Math.ceil(pool.length * 0.2);
      var seenHere = state.seen.filter(function (id) { return ids.indexOf(id) !== -1; });
      var release = seenHere.slice(0, Math.max(1, seenHere.length - keep));
      state.seen = state.seen.filter(function (id) { return release.indexOf(id) === -1; });
      unseen = pool.filter(function (q) {
        return state.seen.indexOf(q.id) === -1 && q.id !== currentId;
      });
      if (!unseen.length) unseen = pool.slice();
    }
    var q = unseen[Math.floor(state.rng() * unseen.length)];
    state.current = q;
    state.options = makeOptions(state, q);
    state.timeLeft = state.config.timerSeconds;
    state.budget = state.config.timerSeconds;
    state.hiddenWrong = [];
    return q;
  }

  function markSeen(state, q) {
    if (q && state.seen.indexOf(q.id) === -1) state.seen.push(q.id);
  }

  function mustUseMC(state) {
    var n = state.config.forceMCAfterFreeWrong;
    return state.mode === 'bac' && n > 0 && state.freeWrongStreak >= n;
  }

  /** Ajoute au compteur de temps ce que la question vient de coûter. */
  function tickSpent(state) {
    var used = (state.budget || state.config.timerSeconds) - state.timeLeft;
    state.spent = Math.round((state.spent || 0) + Math.max(0, used));
  }

  function award(state, points) {
    state.score += points;
    if (state.mode === 'bac') state.pointsSinceCheckpoint += points;
  }

  function penalize(state, points) {
    var actual = Math.min(points, state.score);
    state.score -= actual;
    if (state.mode === 'bac') {
      state.pointsSinceCheckpoint = Math.max(0, state.pointsSinceCheckpoint - actual);
    }
    return actual;
  }

  /** Classe validée : bonus si aucune faute depuis le début de la classe. */
  function classBonus(state) {
    if (state.classErrors > 0) return null;
    var cfg = state.config;
    if (state.levelIndex >= cfg.bonusLifeFromLevel) {
      state.lives += cfg.perfectBonusLife;
      return { kind: 'life', amount: cfg.perfectBonusLife };
    }
    state.score += cfg.perfectBonusPoints;      // hors pointsSinceCheckpoint : acquis au palier
    return { kind: 'points', amount: cfg.perfectBonusPoints };
  }

  /** Bonne réponse : on avance dans la classe. */
  function advance(state) {
    markSeen(state, state.current);
    state.freeWrongStreak = 0;
    state.qIndex++;
    var event = 'nextQuestion';
    state.bonus = null;
    if (state.qIndex >= state.config.questionsPerSubject) {
      state.qIndex = 0;
      state.subjectIndex++;
      event = 'subjectDone';
      if (state.subjectIndex >= subjectsOf(state).length) {
        state.bonus = classBonus(state);
        // on mémorise ce que la classe a rapporté : c'est ce qu'on reperdra si on y redescend,
        // sinon une rétrogradation permettrait de gagner deux fois les mêmes points
        state.levelPoints[state.levelIndex] = state.pointsSinceCheckpoint +
          ((state.bonus && state.bonus.kind === 'points') ? state.bonus.amount : 0);
        state.subjectIndex = 0;
        state.levelIndex++;
        state.pointsSinceCheckpoint = 0;   // palier : les points sont sécurisés
        state.classErrors = 0;
        event = 'levelUp';
        if (state.levelIndex >= state.levels.length) {
          state.finished = true;
          state.won = true;
          state.current = null;
          return 'gameWon';
        }
      }
    }
    nextQuestion(state);
    return event;
  }

  /** Erreur de QCM : retour au début de la classe, perte des points de la classe et d'un cœur. */
  function hardFail(state) {
    markSeen(state, state.current);
    var lost = state.pointsSinceCheckpoint;
    state.score -= lost;
    if (state.score < 0) state.score = 0;
    state.pointsSinceCheckpoint = 0;
    state.qIndex = 0;
    if (state.config.resetScope === 'level') state.subjectIndex = 0;
    state.freeWrongStreak = 0;
    state.classErrors++;
    state.lives--;
    var demoted = false, given = 0;
    if (state.lives <= 0) {                      // plus de cœur : on redescend d'une classe
      state.lives = state.config.lives;
      if (state.levelIndex > 0) {
        state.levelIndex--; demoted = true;
        given = state.levelPoints[state.levelIndex] || 0;   // la classe redevient à refaire
        state.levelPoints[state.levelIndex] = 0;
        state.score = Math.max(0, state.score - given);
      }
      state.classErrors = 0;
    }
    nextQuestion(state);
    return { lost: lost + given, demoted: demoted, lives: state.lives, given: given };
  }

  // ---------------------------------------------------------------- mode détente

  /** 30 questions, thèmes mélangés, difficulté croissante par paliers de 10.
   *  Les questions déjà vues lors des parties précédentes passent en dernier recours :
   *  sans cela, on retombe vite sur les mêmes d'une partie à l'autre. */
  function createRelax(bank, options) {
    options = options || {};
    var cfg = Object.assign({}, CONFIG, options.config || {});
    var rng = rngFor(options);
    var total = cfg.relaxQuestions, tiers = cfg.relaxTiers, perTier = Math.round(total / tiers);
    var seen = (options.seen || []).slice();
    var isSeen = {};
    seen.forEach(function (id) { isSeen[id] = 1; });

    var byTier = {};
    bank.questions.forEach(function (q) {
      var t = Math.min(tiers, Math.max(1, q.difficulty || 2));
      (byTier[t] = byTier[t] || []).push(q);
    });

    var queue = [], used = {};
    for (var t = 1; t <= tiers; t++) {
      var wanted = (t === tiers) ? total - queue.length : perTier;
      var all = (byTier[t] || []).filter(function (q) { return !used[q.id]; });
      // d'abord les questions jamais vues, puis les autres si le palier est trop petit
      var pool = shuffle(all.filter(function (q) { return !isSeen[q.id]; }), rng)
        .concat(shuffle(all.filter(function (q) { return isSeen[q.id]; }), rng));
      if (pool.length < wanted) {
        var extra = shuffle(bank.questions.filter(function (q) {
          return !used[q.id] && pool.indexOf(q) === -1;
        }), rng);
        pool = pool.concat(extra);
      }
      pool.slice(0, wanted).forEach(function (q) { used[q.id] = 1; queue.push(q); });
    }

    var state = {
      mode: 'detente',
      config: cfg,
      themes: bank.themes || [],
      rng: rng,
      queue: queue,
      index: 0,
      score: 0,
      pointsSinceCheckpoint: 0,
      correctCount: 0,
      lives: 0,
      seen: seen,
      freeWrongStreak: 0,
      timeLeft: cfg.timerSeconds,
      budget: cfg.timerSeconds,
      spent: 0,
      jokers: { fifty: false, swap: false, pass: false },   // réservés au mode BAC
      hiddenWrong: [],
      current: queue[0] || null,
      options: [],
      finished: !queue.length,
      won: false,
      log: []
    };
    if (state.current) state.options = makeOptions(state, state.current);
    return state;
  }

  /** Détente : on passe simplement à la question suivante, juste ou faux. */
  function relaxNext(state) {
    markSeen(state, state.current);        // mémorisé pour les parties suivantes
    state.index++;
    state.freeWrongStreak = 0;
    if (state.index >= state.queue.length) {
      state.finished = true; state.won = true; state.current = null;
      return 'gameWon';
    }
    state.current = state.queue[state.index];
    state.options = makeOptions(state, state.current);
    state.timeLeft = state.config.timerSeconds;
    state.budget = state.config.timerSeconds;
    state.hiddenWrong = [];
    return 'nextQuestion';
  }

  // ---------------------------------------------------------------- actions du joueur

  function answerFree(state, input) {
    if (state.finished) return { ok: false, reason: 'finished' };
    if (mustUseMC(state)) return { ok: false, reason: 'mcForced' };
    var q = state.current;
    tickSpent(state);
    var correct = checkFree(q, input);
    var res = { mode: 'free', correct: correct, question: q, given: input, points: 0, lost: 0 };

    if (state.mode === 'detente') {
      if (correct) { award(state, state.config.pointsFree); res.points = state.config.pointsFree; state.correctCount++; }
      res.event = relaxNext(state);
      state.log.push(res);
      return res;
    }

    if (correct) {
      award(state, state.config.pointsFree);
      res.points = state.config.pointsFree;
      res.event = advance(state);
      res.bonus = state.bonus;
    } else {
      state.freeWrongStreak++;
      state.classErrors++;                 // une réponse libre fausse annule le bonus de classe
      markSeen(state, q);
      nextQuestion(state);
      res.event = 'replaced';
      res.mcForced = mustUseMC(state);
    }
    state.log.push(res);
    return res;
  }

  function answerMC(state, choice) {
    if (state.finished) return { ok: false, reason: 'finished' };
    var q = state.current;
    tickSpent(state);
    var correct = normalize(choice) === normalize(q.answer);
    var res = { mode: 'mc', correct: correct, question: q, given: choice, points: 0, lost: 0 };

    if (state.mode === 'detente') {
      if (correct) { award(state, state.config.pointsMC); res.points = state.config.pointsMC; state.correctCount++; }
      res.event = relaxNext(state);
      state.log.push(res);
      return res;
    }

    if (correct) {
      award(state, state.config.pointsMC);
      res.points = state.config.pointsMC;
      res.event = advance(state);
      res.bonus = state.bonus;
    } else {
      var f = hardFail(state);
      res.lost = f.lost;
      res.demoted = f.demoted;
      res.lives = f.lives;
      res.event = f.demoted ? 'demoted' : 'resetToFirst';
    }
    state.log.push(res);
    return res;
  }

  // ---------------------------------------------------------------- jokers

  /** Les jokers s'ouvrent à partir de la 6ème, en mode BAC uniquement. */
  function jokersAvailable(state) {
    return state.mode === 'bac' && state.levelIndex >= state.config.jokersFromLevel;
  }

  /** Un joker est-il utilisable ici et maintenant ? */
  function canUseJoker(state, kind) {
    if (state.finished || !state.current) return false;
    if (!jokersAvailable(state)) return false;
    if (!state.jokers || !state.jokers[kind]) return false;          // déjà utilisé
    if (kind === 'fifty' && state.hiddenWrong.length) return false;  // rien à révéler deux fois
    return state.score >= state.config.jokerCost;
  }

  /**
   * Trois aides, 6 points chacune, une seule fois par partie :
   *   - « fifty » (40/60) : barre trois mauvaises réponses du choix multiple ;
   *   - « swap »          : remplace la question par une autre de la même matière ;
   *   - « pass »          : passe la question, sans point et sans pénalité.
   */
  function useJoker(state, kind) {
    if (!canUseJoker(state, kind)) {
      return { ok: false, reason: !jokersAvailable(state) ? 'tooEarly'
        : (state.jokers && !state.jokers[kind] ? 'used' : 'noPoints') };
    }
    penalize(state, state.config.jokerCost);
    state.jokers[kind] = false;
    state.classErrors++;              // toute aide utilisée annule le bonus de classe sans faute
    var res = { ok: true, kind: kind, cost: state.config.jokerCost, score: state.score };

    if (kind === 'fifty') {
      var wrong = state.options.filter(function (o) {
        return normalize(o) !== normalize(state.current.answer);
      });
      state.hiddenWrong = shuffle(wrong, state.rng).slice(0, state.config.jokerHideCount);
      res.hidden = state.hiddenWrong.slice();
      res.event = 'reveal';
    } else if (kind === 'swap') {
      markSeen(state, state.current);
      nextQuestion(state);
      res.event = 'replaced';
    } else {
      res.event = advance(state);
      res.bonus = state.bonus;
    }
    state.log.push({ mode: 'joker', kind: kind, correct: false, points: 0, lost: res.cost });
    return res;
  }

  /** Sacrifier 1 point pour +15 s (les deux modes). */
  function buyTime(state) {
    if (state.finished) return { ok: false, reason: 'finished' };
    if (state.score < state.config.timeBuyCost) return { ok: false, reason: 'noPoints' };
    penalize(state, state.config.timeBuyCost);
    state.timeLeft += state.config.timeBuySeconds;
    state.budget += state.config.timeBuySeconds;
    return { ok: true, timeLeft: state.timeLeft, score: state.score };
  }

  /** Le timer arrive à zéro. */
  function timeout(state) {
    if (state.finished) return { ok: false, reason: 'finished' };
    var q = state.current;
    tickSpent(state);
    var res = { mode: 'timeout', correct: false, question: q, points: 0, lost: 0 };
    if (state.mode === 'detente') {
      res.event = relaxNext(state);
      state.log.push(res);
      return res;
    }
    res.lost = penalize(state, state.config.timeoutPenalty);
    state.classErrors++;
    markSeen(state, q);
    nextQuestion(state);
    res.event = 'replaced';
    state.log.push(res);
    return res;
  }

  function progress(state) {
    if (state.mode === 'detente') {
      return {
        mode: 'detente',
        question: state.index + 1,
        of: state.queue.length,
        theme: state.current ? state.current.theme : null,
        score: state.score,
        spent: state.spent || 0,
        correct: state.correctCount,
        mcForced: false
      };
    }
    var subs = subjectsOf(state);
    return {
      mode: 'bac',
      level: state.levels[state.levelIndex],
      subject: subs[state.subjectIndex],
      subjects: subs,
      question: state.qIndex + 1,
      of: state.config.questionsPerSubject,
      step: state.subjectIndex + 1,
      steps: subs.length,
      score: state.score,
      atRisk: state.pointsSinceCheckpoint,
      lives: state.lives,
      perfectSoFar: state.classErrors === 0,
      spent: state.spent || 0,
      jokers: state.jokers,
      jokersOpen: jokersAvailable(state),
      jokerCost: state.config.jokerCost,
      hiddenWrong: state.hiddenWrong || [],
      mcForced: mustUseMC(state)
    };
  }

  /** Photographie d'une partie, sérialisable en JSON : de quoi reprendre plus tard. */
  function serialize(state) {
    return {
      v: 1,
      mode: state.mode,
      levelIndex: state.levelIndex || 0,
      subjectIndex: state.subjectIndex || 0,
      qIndex: state.qIndex || 0,
      score: state.score,
      pointsSinceCheckpoint: state.pointsSinceCheckpoint || 0,
      lives: state.lives,
      classErrors: state.classErrors || 0,
      levelPoints: (state.levelPoints || []).slice(),
      seen: (state.seen || []).slice(),
      freeWrongStreak: state.freeWrongStreak || 0,
      spent: state.spent || 0,
      jokers: state.jokers ? Object.assign({}, state.jokers) : null,
      timeLeft: Math.round(state.timeLeft),
      currentId: state.current ? state.current.id : null,
      queueIds: state.queue ? state.queue.map(function (q) { return q.id; }) : null,
      index: state.index || 0,
      correctCount: state.correctCount || 0,
      answered: (state.answeredBefore || 0) + state.log.length,
      level: state.levels ? state.levels[state.levelIndex] : null,
      date: Date.now()
    };
  }

  /** Reconstruit une partie à partir d'une photographie. */
  function restore(data, banks, options) {
    if (!data || !data.mode) return null;
    var bank = data.mode === 'detente' ? banks.detente : banks.bac;
    if (!bank) return null;
    var byId = {};
    bank.questions.forEach(function (q) { byId[q.id] = q; });

    var state = data.mode === 'detente'
      ? createRelax(bank, options)
      : createGame(bank, options);

    if (data.mode === 'detente') {
      var queue = (data.queueIds || []).map(function (id) { return byId[id]; }).filter(Boolean);
      if (queue.length) state.queue = queue;
      state.index = Math.min(data.index || 0, state.queue.length - 1);
      state.correctCount = data.correctCount || 0;
      state.current = state.queue[state.index];
    } else {
      state.levelIndex = data.levelIndex || 0;
      state.subjectIndex = data.subjectIndex || 0;
      state.qIndex = data.qIndex || 0;
      state.lives = data.lives || state.config.lives;
      state.classErrors = data.classErrors || 0;
      state.levelPoints = (data.levelPoints || []).slice();
      state.pointsSinceCheckpoint = data.pointsSinceCheckpoint || 0;
      state.current = byId[data.currentId] || null;
      if (!state.current) nextQuestion(state);          // question disparue : on en tire une autre
    }

    state.score = data.score || 0;
    state.spent = data.spent || 0;
    if (data.jokers) state.jokers = Object.assign({}, data.jokers);
    state.seen = (data.seen || []).slice();
    state.freeWrongStreak = data.freeWrongStreak || 0;
    state.answeredBefore = data.answered || 0;
    // le chrono reprend là où il s'était arrêté : mettre la partie de côté ne rend pas du temps.
    // Un plancher de quelques secondes laisse le temps de relire la question, et ce supplément
    // est ajouté au budget pour qu'il ne soit pas compté comme du temps de réflexion.
    var saved = typeof data.timeLeft === 'number' ? data.timeLeft : state.config.timerSeconds;
    saved = Math.max(0, Math.min(saved, state.config.timerSeconds));
    var granted = Math.max(saved, Math.min(state.config.resumeMinSeconds, state.config.timerSeconds));
    state.timeLeft = granted;
    state.budget = granted;
    state.hiddenWrong = [];
    if (state.current) state.options = makeOptions(state, state.current);
    state.finished = false;
    state.won = false;
    return state;
  }

  /** Score maximum théorique d'une partie parfaite (bonus compris). */
  function maxScore(bank) {
    var pools = {};
    bank.questions.forEach(function (q) { pools[q.level + '|' + q.subject] = 1; });
    var total = 0;
    bank.levels.forEach(function (lv, i) {
      var n = bank.subjects.filter(function (s) { return pools[lv + '|' + s]; }).length;
      total += n * CONFIG.pointsFree;
      if (i < CONFIG.bonusLifeFromLevel) total += CONFIG.perfectBonusPoints;
    });
    return total;
  }

  return {
    CONFIG: CONFIG,
    normalize: normalize,
    levenshtein: levenshtein,
    toNumber: toNumber,
    checkFree: checkFree,
    createGame: createGame,
    createRelax: createRelax,
    nextQuestion: nextQuestion,
    answerFree: answerFree,
    answerMC: answerMC,
    buyTime: buyTime,
    useJoker: useJoker,
    canUseJoker: canUseJoker,
    timeout: timeout,
    mustUseMC: mustUseMC,
    progress: progress,
    serialize: serialize,
    restore: restore,
    maxScore: maxScore,
    mulberry32: mulberry32
  };
});
</script>
<script>/* Quiz Culture — pseudo, meilleurs scores et classement.
 *
 * Fonctionne toujours en local. Si data/leaderboard.json contient une URL Supabase et sa clé
 * publique, les scores sont aussi envoyés en ligne et le classement mondial est lisible.
 * Aucune donnée personnelle : un pseudo choisi par le joueur, un score, une date.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Scores = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var K_PSEUDO = 'quizculture.pseudo';
  var K_TAG = 'quizculture.tag';         // numéro de joueur, pour distinguer les homonymes
  var K_LOCAL = 'quizculture.scores';
  var K_QUEUE = 'quizculture.queue';
  var K_BEST = 'quizculture.best';       // meilleur score par mode
  var K_SLOT = 'quizculture.save';       // partie en cours, pour reprendre plus tard
  var K_LEVEL = 'quizculture.lastLevel'; // dernière classe atteinte, pour filtrer le classement
  var K_ERR = 'quizculture.lastError';   // dernier refus du serveur, affiché dans le classement

  function conf() {
    var c = (typeof window !== 'undefined' && window.LEADERBOARD) || {};
    return (c.url && c.anonKey) ? c : null;
  }
  function online() { return !!conf() && (typeof navigator === 'undefined' || navigator.onLine !== false); }

  function read(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* stockage plein ou privé */ }
  }

  // ------------------------------------------------------------------ pseudo
  /** Nettoie un pseudo : lettres, chiffres, espaces et tirets, 3 à 14 caractères. */
  function cleanPseudo(p) {
    return String(p || '')
      .replace(/[^\p{L}\p{N} _-]/gu, '')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 14);
  }
  function pseudoValid(p) { return cleanPseudo(p).length >= 3; }
  function getPseudo() { try { return localStorage.getItem(K_PSEUDO) || ''; } catch (e) { return ''; } }

  /** Numéro de joueur à 5 chiffres, tiré une seule fois puis conservé : « Benji #04217 ».
   *  Deux joueurs peuvent choisir le même pseudo, le numéro les distingue au classement. */
  function getTag() {
    var t;
    try { t = localStorage.getItem(K_TAG); } catch (e) { t = null; }
    if (t && /^\d{5}$/.test(t)) return t;
    var n;
    try {
      var buf = new Uint32Array(1);
      (self.crypto || window.crypto).getRandomValues(buf);
      n = buf[0] % 100000;
    } catch (e) { n = Math.floor(Math.random() * 100000); }
    t = ('0000' + n).slice(-5);
    try { localStorage.setItem(K_TAG, t); } catch (e) { /* ignore */ }
    return t;
  }
  /** Nom affiché : pseudo + numéro. */
  function displayName(pseudo, tag) {
    var p = pseudo || getPseudo() || 'Anonyme';
    return p + ' #' + (tag || getTag());
  }
  function setPseudo(p) {
    var c = cleanPseudo(p);
    if (!pseudoValid(c)) return null;
    try { localStorage.setItem(K_PSEUDO, c); } catch (e) { /* ignore */ }
    return c;
  }

  // ------------------------------------------------------------------ meilleur score
  function best(mode) { return (read(K_BEST, {}) || {})[mode || 'bac'] || 0; }
  function saveBest(mode, score) {
    var all = read(K_BEST, {});
    if (score > (all[mode] || 0)) { all[mode] = score; write(K_BEST, all); return true; }
    return false;
  }

  // ------------------------------------------------------------------ partie sauvegardée
  function saveSlot(data) { write(K_SLOT, data); }
  function loadSlot() { return read(K_SLOT, null); }
  function clearSlot() { try { localStorage.removeItem(K_SLOT); } catch (e) { /* ignore */ } }
  function hasSlot() { var d = loadSlot(); return !!(d && d.mode); }

  function lastLevel() { try { return localStorage.getItem(K_LEVEL) || ''; } catch (e) { return ''; } }
  function setLastLevel(lv) { try { if (lv) localStorage.setItem(K_LEVEL, lv); } catch (e) { /* ignore */ } }

  // ------------------------------------------------------------------ scores locaux
  /** À score égal, le plus rapide passe devant. */
  function byScoreThenTime(a, b) {
    if (b.score !== a.score) return b.score - a.score;
    var ta = a.seconds || Infinity, tb = b.seconds || Infinity;
    return ta - tb;
  }
  function localScores(mode) {
    return read(K_LOCAL, []).filter(function (s) { return !mode || s.mode === mode; })
      .sort(byScoreThenTime);
  }
  function pushLocal(entry) {
    var all = read(K_LOCAL, []);
    all.push(entry);
    all.sort(byScoreThenTime);
    write(K_LOCAL, all.slice(0, 200));
  }

  // ------------------------------------------------------------------ diagnostic
  /** Mémorise le dernier refus du serveur : sans cela, un envoi raté est silencieux. */
  function noteError(msg) {
    try { localStorage.setItem(K_ERR, JSON.stringify({ msg: String(msg).slice(0, 220), at: Date.now() })); }
    catch (e) { /* ignore */ }
  }
  function clearError() { try { localStorage.removeItem(K_ERR); } catch (e) { /* ignore */ } }
  function lastError() { return read(K_ERR, null); }

  // ------------------------------------------------------------------ envoi en ligne
  /** En-têtes d'appel. La clé « anon » historique est un JWT (eyJ…) et sert aussi de jeton ;
   *  les nouvelles clés « publishable » (sb_publishable_…) n'en sont pas et ne doivent pas
   *  partir en Authorization, sous peine d'être rejetées comme jeton invalide. */
  function heads(c, extra) {
    var h = { 'apikey': c.anonKey };
    if (/^eyJ/.test(c.anonKey)) h['Authorization'] = 'Bearer ' + c.anonKey;
    for (var k in extra) if (extra.hasOwnProperty(k)) h[k] = extra[k];
    return h;
  }

  function post(entry) {
    var c = conf();
    if (!c) return Promise.reject(new Error('non configuré'));
    return fetch(c.url.replace(/\/$/, '') + '/rest/v1/scores', {
      method: 'POST',
      headers: heads(c, { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }),
      body: JSON.stringify({
        pseudo: entry.pseudo, tag: entry.tag, score: entry.score,
        mode: entry.mode, level: entry.level || null, seconds: entry.seconds || null
      })
    }).then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) {
          noteError('envoi refusé — HTTP ' + r.status + (t ? ' · ' + t.replace(/\s+/g, ' ') : ''));
          throw new Error('HTTP ' + r.status);
        }, function () {
          noteError('envoi refusé — HTTP ' + r.status);
          throw new Error('HTTP ' + r.status);
        });
      }
      clearError();
      return true;
    }, function (e) {
      noteError('envoi impossible — ' + (e && e.message ? e.message : 'réseau'));
      throw e;
    });
  }

  /** Renvoie les scores en attente (parties jouées hors ligne). */
  function queued() { return read(K_QUEUE, []); }

  function flush() {
    var q = queued();
    if (!q.length || !online()) return Promise.resolve(0);
    var rest = [], sent = 0;
    return q.reduce(function (chain, entry) {
      return chain.then(function () {
        return post(entry).then(function () { sent++; }, function () { rest.push(entry); });
      });
    }, Promise.resolve()).then(function () {
      write(K_QUEUE, rest);
      return sent;
    });
  }

  /** Enregistre un score : toujours en local, en ligne si possible, sinon mis en file. */
  function submit(entry) {
    entry = {
      pseudo: cleanPseudo(entry.pseudo) || 'Anonyme',
      tag: entry.tag || getTag(),
      score: Math.max(0, Math.round(entry.score || 0)),
      mode: entry.mode || 'bac',
      level: entry.level || null,
      seconds: Math.max(0, Math.round(entry.seconds || 0)) || null,
      date: new Date().toISOString()
    };
    pushLocal(entry);
    setLastLevel(entry.level);
    var record = saveBest(entry.mode, entry.score);
    if (!conf()) return Promise.resolve({ stored: 'local', record: record });
    return post(entry).then(function () {
      return { stored: 'online', record: record };
    }, function () {
      var q = queued(); q.push(entry); write(K_QUEUE, q);

    });

  function top(mode, limit) {
    limit = limit || 50;
    var c = conf();
    if (!c || !online()) {
      return Promise.resolve({ source: 'local', rows: localScores(mode).slice(0, limit) });
    }
    var url = c.url.replace(/\/$/, '') + '/rest/v1/scores?select=pseudo,tag,score,mode,level,seconds,created_at' +
      '&mode=eq.' + encodeURIComponent(mode || 'bac') +
      '&order=score.desc,seconds.asc.nullslast&limit=' + limit;
    return fetch(url, { headers: heads(c) })
      .then(function (r) {
        if (!r.ok) {
          return r.text().then(function (t) {
            noteError('lecture refusée — HTTP ' + r.status + (t ? ' · ' + t.replace(/\s+/g, ' ') : ''));
            throw new Error('HTTP ' + r.status);
          });
        }
        return r.json();
      })
      .then(function (rows) { return { source: 'online', rows: rows }; })
      .catch(function () { return { source: 'local', rows: localScores(mode).slice(0, limit) }; });
  }

  /** Envoi de test : dépose une ligne « Test » et renvoie la réponse brute du serveur.
   *  Ne lève jamais : c'est un outil de diagnostic, pas un chemin de jeu. */
  function testInsert() {
    var c = conf();
    if (!c) return Promise.resolve('aucune configuration : classement local');

    var body = { pseudo: 'Test', tag: getTag(), score: 1, mode: 'detente', level: null, seconds: 1 };
    return fetch(url, {
      method: 'POST',
      headers: heads(c, { 'Content-Type': 'application/json', 'Prefer': 'return=representation' }),
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.text().then(function (t) {
        return 'POST ' + r.status + ' ' + (r.statusText || '') + ' · ' +
          (t ? t.replace(/\s+/g, ' ').slice(0, 300) : '(réponse vide)');
      }, function () { return 'POST ' + r.status + ' (corps illisible)'; });
    }, function (e) {
      return 'POST impossible · ' + (e && e.message ? e.message : 'erreur réseau');
    });
  }

  /** Le stockage local est-il réellement utilisable ? (navigation privée, quota, réglages) */
  function storageOk() {
    try {
      localStorage.setItem('quizculture.test', '1');
      var ok = localStorage.getItem('quizculture.test') === '1';
      localStorage.removeItem('quizculture.test');
      return ok;
    } catch (e) { return false; }
  }

  /** État de santé, affiché en bas des règles : de quoi diagnostiquer sans brancher un câble. */
  function health() {
    var c = conf();
    return {
      configured: !!c,
      host: c ? c.url.replace(/^https?:\/\//, '').split('.')[0] : null,
      keyKind: c ? (/^eyJ/.test(c.anonKey) ? 'anon (JWT)' : (/^sb_/.test(c.anonKey) ? 'publishable' : 'inconnue')) : null,
      storage: storageOk(),
      local: localScores().length,
      best: best('bac') + ' / ' + best('detente'),
      queued: queued().length,
      lastError: (lastError() || {}).msg || null
    };
  }

  return {
    configured: function () { return !!conf(); },
    storageOk: storageOk,
    health: health,
    testInsert: testInsert,
    cleanPseudo: cleanPseudo,
    pseudoValid: pseudoValid,
    getPseudo: getPseudo,
    setPseudo: setPseudo,
    getTag: getTag,
    displayName: displayName,
    saveSlot: saveSlot,
    loadSlot: loadSlot,
    clearSlot: clearSlot,
    hasSlot: hasSlot,
    lastLevel: lastLevel,
    byScoreThenTime: byScoreThenTime,
    lastError: lastError,
    clearError: clearError,
    best: best,
    localScores: localScores,
    submit: submit,
    top: top,
    flush: flush,
    queued: queued
  };
});
</script>

          (slotLabel() ? '<button class="btn resume" id="resume">Reprendre<br><small style="font-weight:600">' +
            slotLabel() + '</small></button>' : '') +

  /** Décrit la partie mise de côté : « Quizz BAC — CM2, 34 points ». */
  function slotLabel() {
    var d = S.loadSlot();
    if (!d || !d.mode) return '';
    if (d.mode === 'detente') return 'Quizz détente — question ' + ((d.index || 0) + 1) + '/30, ' + d.score + ' pts';
    return 'Quizz BAC — ' + (d.level || '?') + ', ' + d.score + ' pts';
  }

  /** Le tableau s'ouvre en vortex et aspire le héros vers la forêt. */
  function vortex(done) {
    sfx.vortex();
    // aperçu de la forêt dessiné directement à la taille du tableau (x 50→154, y 22→80) :
    // aucun découpage nécessaire, donc aucun risque de débordement selon le navigateur
    var peek = '<rect x="50" y="22" width="104" height="58" fill="#1d6b2f"/>' +
      '<rect x="50" y="58" width="104" height="22" fill="#14561f"/>' +
      '<ellipse cx="72" cy="71" rx="15" ry="6" fill="#1f5f86"/>' +
      '<ellipse cx="70" cy="70" rx="10" ry="3.5" fill="#2f86ad"/>';
    [[58, 40], [70, 30], [86, 44], [100, 32], [116, 42], [132, 31], [146, 44], [124, 60], [60, 56]]
      .forEach(function (t) {
        peek += '<rect x="' + (t[0] - 1.5) + '" y="' + (t[1] - 1) + '" width="3" height="6" fill="#4a2f1a"/>' +
          '<ellipse cx="' + t[0] + '" cy="' + (t[1] - 4) + '" rx="6" ry="5" fill="#0f5222"/>' +
          '<ellipse cx="' + (t[0] - 1) + '" cy="' + (t[1] - 5) + '" rx="4.5" ry="3.5" fill="#1c7a36"/>';
      });
    var rings = '';
    for (var i = 0; i < 6; i++) {
      rings += '<circle cx="102" cy="51" r="' + (5 + i * 7) + '" fill="none" stroke="rgba(255,255,255,.5)" ' +
        'stroke-width="2.5" stroke-dasharray="' + (9 + i * 5) + ' ' + (12 + i * 4) + '"/>';
    }
    var board = peek +
      '<g class="swirl">' + rings + '</g>' +
      '<ellipse cx="102" cy="51" rx="13" ry="11" fill="#04150a"/>' +
      '<ellipse cx="102" cy="51" rx="7" ry="6" fill="#000000"/>';
    fx.innerHTML = '<div class="vortex"><div class="scene" style="max-width:430px;width:100%">' +
      classroom({ board: '#08210f', boardContent: board, heroClass: 'sucked', frame: 1 }) +
      '</div></div>';
    setTimeout(function () { fx.innerHTML = ''; if (done) done(); }, 1650);
  }

  /** Pop-up de pseudo : on peut valider ou fermer par la croix. */
  function askPseudo(done) {
    fx.innerHTML =
      '<div class="modal"><div class="modal-card">' +
        '<button class="close-x" id="px">✕</button>' +
        '<h2 class="center" style="margin:0 0 4px">Choisis ton pseudo</h2>' +
        '<div class="hint center" style="margin:0 0 12px">Ton numéro de joueur : <b>#' + esc(S.getTag()) + '</b></div>' +
        '<input type="text" id="pseudo" maxlength="14" placeholder="3 à 14 caractères" value="' + esc(S.getPseudo()) + '">' +
        '<div class="hint center" id="perr"></div>' +
        '<button class="btn go" id="pok">Valider</button>' +
      '</div></div>';
    var input = document.getElementById('pseudo');
    if (!('ontouchstart' in window)) input.focus();
    function close() { fx.innerHTML = ''; if (done) done(); }
    function submit() {
      if (!S.setPseudo(input.value)) {
        document.getElementById('perr').textContent = 'Au moins 3 caractères.';
        return;
      }
      close();
    }
    document.getElementById('pok').onclick = submit;
    document.getElementById('px').onclick = close;
    input.onkeydown = function (e) { if (e.key === 'Enter') submit(); };
  }

  /** Chapeau de diplômé et feuille, dessinés pour rester nets à toute taille. */
  function icoBac() {

      '<path d="M8 14 v6 c0 2 14 2 14 0 v-6" fill="none" stroke="#2a2140" stroke-width="2.4"/>' +
      '<path d="M26 12 v8" stroke="#2a2140" stroke-width="2.4"/><circle cx="26" cy="22" r="2.2" fill="#2a2140"/></svg>';
  }
  function icoRelax() {
    return '<svg width="30" height="30" viewBox="0 0 30 30">' +
      '<path d="M15 26 C15 14 20 6 27 4 C27 14 23 24 15 26 Z" fill="#fff" stroke="#2a2140" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<path d="M15 26 C13 18 9 12 3 10 C4 18 8 24 15 26 Z" fill="#fff" stroke="#2a2140" stroke-width="2.4" stroke-linejoin="round"/>' +

  function startMode(mode) {
    // premier lancement : on propose le pseudo, mais la croix permet de jouer sans
    if (!S.pseudoValid(S.getPseudo()) && !pseudoAsked) {
      pseudoAsked = true;
      return askPseudo(function () { startMode(mode); });
    }
    if (mode === 'bac') game = E.createGame(BANK, { seen: seenIds() });
    else game = E.createRelax(RELAX, {});
    feedback = null; revealed = null; mcOpen = false; draft = ''; anim = null; lastQ = null;
    jokersAnnounced = false;
    view = 'play'; startTimer(); render();
  }

  /** Sauvegarde silencieuse après chaque question : fermer l'app ne perd plus rien. */
  function autoSave() {
    if (!game || game.finished) return;
    try { S.saveSlot(E.serialize(game)); } catch (e) { /* stockage indisponible */ }
  }

  /** Reprise de la partie mise de côté. */
  function resumeGame() {
    var data = S.loadSlot();
    if (!data) { view = 'modes'; return render(); }
    var g = E.restore(data, { bac: BANK, detente: RELAX }, {});
    if (!g || !g.current) { S.clearSlot(); view = 'modes'; return render(); }
    game = g;
    feedback = null; revealed = null; mcOpen = false; draft = ''; anim = null; lastQ = null;
    // partie reprise en secondaire sans avoir encore vu l'écran des jokers : on l'annonce
    var pr = E.progress(game);
    jokersAnnounced = !(pr.jokersOpen && pr.jokers && pr.jokers.fifty && pr.jokers.swap && pr.jokers.pass);
    if (!jokersAnnounced) { jokersAnnounced = true; view = 'jokers'; return render(); }
    view = 'play'; startTimer(); render();
  }

  /** Historique des questions vues, conservé entre les parties (anti-répétition). */
  function seenIds() {
    try { return JSON.parse(localStorage.getItem('quizculture.seen')) || []; } catch (e) { return []; }
  }
  function saveSeen(ids) {
    try { localStorage.setItem('quizculture.seen', JSON.stringify(ids.slice(-1200))); } catch (e) { /* ignore */ }
  }

  function renderPlay() {
    // sur la toute dernière question, le moteur a déjà terminé la partie : on garde l'énoncé
    // sous la main pour afficher le retour, l'écran de fin arrive juste après
    // pendant le retour, on garde l'énoncé de la question à laquelle le joueur vient de répondre :
    // le moteur a déjà tiré la suivante, et on l'apercevait le temps d'un éclair
    var q = (feedback && lastQ) || game.current || lastQ;
    if (!q) return finishGame();
    var p = E.progress(game);
    var pct = Math.max(0, Math.min(100, game.timeLeft / game.config.timerSeconds * 100));
    var cls = game.timeLeft <= 5 ? 'crit' : (game.timeLeft <= 10 ? 'low' : '');
    var fb = feedback ? (feedback.good ? ' pop-good' : ' pop-bad') : '';
    var head;

    if (game.finished) {                            // partie terminée : bandeau minimal
      head = '<div class="scorebar"><span class="lbl">SCORE</span>' + coins(3) +
        '<span class="val">' + game.score + '</span></div>';
    } else if (p.mode === 'bac') {
      var pips = '';
      for (var i = 0; i < p.steps; i++) {
        pips += '<span class="pip ' + (i < game.subjectIndex ? 'done' : (i === game.subjectIndex ? 'now' : '')) + '"></span>';
      }
      head =
        '<div class="lvl">' + esc(p.level) + '</div>' +
        '<div class="pips">' + pips + '</div>' +
        '<div class="row" style="justify-content:center;gap:12px">' +
          '<div class="scorebar"><span class="lbl">SCORE</span>' + coins(3) + '<span class="val">' + p.score + '</span></div>' +
          hearts(p.lives, Math.max(3, p.lives)) +
        '</div>' +
        '<div class="risk">' + (p.atRisk > 0 ? p.atRisk + ' point' + (p.atRisk > 1 ? 's' : '') + ' en jeu' : 'points sécurisés') +
          (p.perfectSoFar ? ' · classe sans faute' : '') + '</div>';
    } else {
      head =
        '<div class="lvl" style="background:var(--mint);color:#0b3d28">' + p.question + ' / ' + p.of + '</div>' +
        '<div class="row" style="justify-content:center;gap:12px;margin-top:10px">' +
          '<div class="scorebar"><span class="lbl">SCORE</span>' + coins(3) + '<span class="val">' + p.score + '</span></div>' +
        '</div>' +
        '<div class="risk">' + p.correct + ' bonne' + (p.correct > 1 ? 's' : '') + ' réponse' + (p.correct > 1 ? 's' : '') + '</div>';
    }

    var body =
      '<div class="hud">' +
        '<button class="quit" id="quit">‖ Pause</button>' +
        infoBtn() +
        head +
      '</div>' +
      '<div class="card' + fb + '">' +
        (feedback && feedback.delta ? '<span class="gain ' + (feedback.delta > 0 ? 'plus">+' : 'minus">') + feedback.delta + '</span>' : '') +
        '<div class="timer ' + cls + '"><i style="width:' + pct + '%"></i></div>' +
        '<div class="between"><small class="muted">' + Math.ceil(game.timeLeft) + ' s</small>' +
          '<button class="chip" id="buy" ' + (game.score < 1 ? 'disabled' : '') + '>−1 point → +15 s</button></div>' +
        (p.jokersOpen ? jokerBar(p) : '') +
        '<div class="subject" style="color:' + (SUBJECT_COLORS[q.subject || p.subject] || '#0aa2c0') + '">' +
          esc(p.mode === 'bac' ? (q.subject || p.subject) : (q.theme || p.theme || '')) + '</div>' +
        '<div class="q">' + esc(q.prompt) + '</div>';

    if (feedback) {
      body += '<div class="feedback ' + (feedback.good ? 'good' : 'bad') + '">' + feedback.text + '</div>';
      if (revealed) {
        body += game.__lastOptions.map(function (o) {
          var k = o === revealed.answer ? 'good' : (o === revealed.given ? 'bad' : '');
          return '<button class="opt ' + k + '" disabled>' + esc(o) + '</button>';
        }).join('');
      }
    } else if (mcOpen || p.mcForced) {
      if (p.mcForced) body += '<div class="hint">Réponse libre manquée : cette question se joue en choix multiple.</div>';
      body += game.options.map(function (o, k) {
        var out = (p.hiddenWrong || []).indexOf(o) !== -1;      // barrée par le joker 40/60
        return '<button class="opt' + (out ? ' out' : '') + '" ' + (out ? 'disabled' : 'data-opt="' + k + '"') +
          '>' + esc(o) + '</button>';
      }).join('');
      body += '<div class="hint">' + (p.mode === 'bac'
        ? 'Bonne réponse : +1 point. Erreur : retour au début de la classe, un cœur perdu.'
        : 'Bonne réponse : +1 point. Erreur : on passe simplement à la suivante.') + '</div>';
      if (!p.mcForced) body += '<button class="btn ghost" id="closemc">Revenir à la réponse libre (2 pts)</button>';
    } else {
      body +=
        // formulaire : la touche « OK » du clavier mobile valide directement, sans le masquer
        '<form id="answer-form" autocomplete="off">' +
          '<div class="row">' +
            '<input type="text" id="free" placeholder="Ta réponse…" autocomplete="off" ' +
              'autocapitalize="off" spellcheck="false" enterkeyhint="send" inputmode="text">' +
            '<button type="button" class="mic' + (recognizing ? ' rec' : '') + '" id="mic" title="Dicter la réponse">🎤</button>' +
          '</div>' +
          '<button type="submit" class="btn go" id="send">Valider (2 pts)</button>' +
        '</form>' +
        '<button class="btn ghost" id="openmc">Voir 5 propositions (1 pt)</button>';
    }
    body += '</div>';
    app.innerHTML = body;
    wirePlay();
  }

  /** Pause : quatre issues claires, sans message du navigateur. */
  function renderPause() {
    var p = E.progress(game);
    var where = game.mode === 'detente'
      ? 'Question ' + p.question + ' / ' + p.of
      : p.level + ' · ' + p.subject;
    app.innerHTML =
      '<div class="card">' + infoBtn() +
        '<h1 class="center">Pause</h1>' +
        '<p class="center muted" style="margin-top:0">' + esc(where) + ' — <b>' + game.score + ' points</b></p>' +
        '<button class="choice go" id="p-resume"><b>▶ Continuer à jouer</b>' +
          '<small>Le chrono reprend où tu l\'as laissé : ' + Math.ceil(game.timeLeft) + ' s.</small></button>' +
        '<button class="choice save" id="p-save"><b>💾 M\'arrêter ici</b>' +
          '<small>Ta partie est mise de côté, chrono compris : tu la reprendras depuis l\'accueil.</small></button>' +
        '<button class="choice pub" id="p-publish"><b>🏆 Publier mon score</b>' +
          '<small>Ton score de ' + game.score + ' points rejoint le classement' +
          (game.mode === 'detente' ? '' : ' de la classe ' + esc(p.level)) + ', et la partie s\'arrête.</small></button>' +
        '<button class="choice quit" id="p-quit"><b>✕ Abandonner</b>' +
          '<small>Retour à l\'accueil sans enregistrer ni sauvegarder.</small></button>' +
      '</div>';
    document.getElementById('info').onclick = openRules;
    document.getElementById('p-resume').onclick = function () { view = 'play'; startTimer(); render(); };
    document.getElementById('p-save').onclick = function () {
      autoSave();
      view = 'title'; render();
    };
    document.getElementById('p-publish').onclick = function () { publishScore(); };
    document.getElementById('p-quit').onclick = function () {
      S.clearSlot();
      view = 'title'; render();
    };
  }

  /** Publier en cours de partie : le score compte pour la classe atteinte. */
  function publishScore() {
    stopTimer();
    var level = game.mode === 'bac' ? E.progress(game).level : null;
    try {
      if (game.mode === 'bac') saveSeen(game.seen);
      S.submit({ pseudo: S.getPseudo(), score: game.score, mode: game.mode, level: level,
        seconds: E.progress(game).spent });
    } catch (e) { /* score non enregistré */ }
    S.clearSlot();
    game.__submitted = true;
    published = { score: game.score, level: level, mode: game.mode };
    openRanking(game.mode === 'detente' ? 'detente' : 'bac');
  }
  var published = null;

  var rulesFrom = 'title';
  /** Le « i » ouvre les règles ; le chrono s'arrête si une question était en cours. */
  function openRules() {
    if (view === 'rules') return;
    rulesFrom = view;

  // ------------------------------------------------------------------ animation carte
  function animPawn() {
    var a = pos(anim.from), b = pos(anim.to);
    if (anim.phase !== 'walk') return { x: a.x, y: a.y, frame: 0, hop: 0 };
    var t = anim.t, ease = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    return {
      x: a.x + (b.x - a.x) * ease, y: a.y + (b.y - a.y) * ease,
      hop: Math.abs(Math.sin(t * Math.PI * 3)) * 6, frame: Math.floor(t * 12) % 2
    };
  }
  var DUR = { path: 900, node: 400, walk: 1200 };
  function runReveal(from, to, done) {
    anim = { from: from, to: to, phase: to > from ? 'path' : 'walk', t: 0 };
    render();
    var last = Date.now(), soundAt = 0;
    var id = setInterval(function () {
      var now = Date.now(); anim.t += (now - last) / DUR[anim.phase]; last = now;
      if (anim.t >= 1) {
        anim.t = 0; soundAt = 0;
        if (anim.phase === 'path') { anim.phase = 'node'; sfx.popNode(); render(); return; }
        if (anim.phase === 'node') { anim.phase = 'walk'; render(); return; }
        clearInterval(id); anim = null; render();
        if (done) done();
        return;
      }
      if (anim.phase === 'path') {
        if (anim.t > soundAt) { soundAt += .14; sfx.dig(); }
        var g = document.getElementById('growing');
        if (g) {
          var L = segLen(Math.min(anim.from, anim.to));
          Array.prototype.forEach.call(g.children, function (ln) { ln.setAttribute('stroke-dashoffset', L * (1 - anim.t)); });
        } else render();
      } else if (anim.phase === 'node') {
        var n = document.getElementById('newnode');
        if (n && n.firstChild) {
          var p = pos(Math.max(anim.from, anim.to)), sc = 0.2 + 0.8 * anim.t;
          n.firstChild.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ') scale(' + sc + ') translate(' + (-p.x) + ',' + (-p.y) + ')');
        } else render();
      } else {
        if (anim.t > soundAt) { soundAt += .3; sfx.step(); }
        var pw = animPawn(), pawn = document.getElementById('pawn');
        if (pawn) {
          var px = 2.2, w = SPRITE_W * px;
          pawn.setAttribute('transform', 'translate(' + (pw.x - w / 2) + ',' + (pw.y + 4 - SPRITE_H * px) + ')');
          pawn.lastChild.setAttribute('transform', 'translate(0,' + (-pw.hop) + ')');
          pawn.lastChild.innerHTML = sprite(px, pw.frame);
        } else render();
      }
    }, 50);
  }
