  function wirePlay() {
    var inf = document.getElementById('info'); if (inf) inf.onclick = openRules;
    var quit = document.getElementById('quit');
    if (quit) quit.onclick = function () { stopTimer(); view = 'pause'; render(); };
    var buy = document.getElementById('buy');
    if (buy) buy.onclick = function () { if (E.buyTime(game).ok) sfx.buy(); render(); };
    var input = document.getElementById('free');
    var form = document.getElementById('answer-form');
    if (form) form.onsubmit = function (e) { e.preventDefault(); submitFree(); };
    if (input) {
      input.value = draft;
      if (!('ontouchstart' in window)) input.focus();
      input.oninput = function () { draft = input.value; };
      input.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); submitFree(); } };
      // le clavier mobile masque le bas de l'écran : on ramène la zone de réponse dans la vue
      input.onfocus = function () {
        setTimeout(function () {
          try { input.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { /* vieux navigateur */ }
        }, 250);
      };
    }
    var openmc = document.getElementById('openmc'); if (openmc) openmc.onclick = function () { mcOpen = true; render(); };
    var closemc = document.getElementById('closemc'); if (closemc) closemc.onclick = function () { mcOpen = false; render(); };
    var mic = document.getElementById('mic'); if (mic) mic.onclick = dictate;
    Array.prototype.forEach.call(document.querySelectorAll('[data-opt]'), function (b) {
      b.onclick = function () { submitMC(game.options[+b.getAttribute('data-opt')]); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-joker]'), function (b) {
      b.onclick = function () { playJoker(b.getAttribute('data-joker')); };
    });
  }

  function submitFree() {
    var input = document.getElementById('free');
    var val = (input ? input.value : draft).trim();
    if (!val) return;
    draft = '';
    var q = game.current;
    var opts = game.options.slice();                 // /!\ à capturer AVANT de répondre :
    var r = E.answerFree(game, val);                 // le moteur passe déjà à la question suivante
    if (r.ok === false) return render();
    if (game.mode === 'detente' && !r.correct) {
      game.__lastOptions = opts;                     // on révèle la bonne réponse de CETTE question
      revealed = { answer: q.answer, given: null };
    }
    after(r, q, r.correct ? 'Bravo !'
      : '« ' + esc(val) + ' » n\'est pas la réponse. C\'était : <b>' + esc(q.answer) + '</b>.' +
        (game.mode === 'bac' ? ' Nouvelle question, en choix multiple.' : ''));
  }

  function submitMC(choice) {
    var q = game.current;
    game.__lastOptions = game.options.slice();        // avant de répondre, idem
    var r = E.answerMC(game, choice);
    if (r.ok === false) return render();
    revealed = { answer: q.answer, given: choice };
    var text;
    if (r.correct) text = 'Bien vu !';
    else if (game.mode === 'detente') text = 'Raté — la réponse était <b>' + esc(q.answer) + '</b>.';
    else if (r.demoted) text = 'Plus de cœur : tu redescends d\'une classe.';
    else text = 'Raté — retour au début de la classe, un cœur perdu' +
      (r.lost ? ' et ' + r.lost + ' point' + (r.lost > 1 ? 's' : '') + ' effacé' + (r.lost > 1 ? 's' : '') : '') + '.';
    after(r, q, text);
  }

  /** Utilisation d'un joker, avec le retour visuel qui va avec. */
  function playJoker(kind) {
    var q = game.current;
    var r = E.useJoker(game, kind);
    if (!r.ok) return render();
    sfx.buy();
    autoSave();
    if (kind === 'fifty') { mcOpen = true; return render(); }         // le QCM s'ouvre, 3 fausses barrées
    if (kind === 'swap') {
      feedback = { good: false, text: 'Question changée — ' + r.cost + ' points.', delta: -r.cost };
      stopTimer();
      render();
      setTimeout(function () { feedback = null; startTimer(); render(); }, 900);
      return;
    }
    // « passer » : on avance sans point
    stopTimer();
    feedback = { good: false, text: 'Question passée — ' + r.cost + ' points. La réponse était <b>' +
      esc(q.answer) + '</b>.', delta: -r.cost };
    render();
    setTimeout(function () {
      feedback = null;
      if (game.finished) return finishGame();
      if (r.event === 'levelUp') {
        game.__bonusShown = r.bonus || null;
        view = 'map'; sfx.levelup();
        runReveal(Math.max(0, game.levelIndex - 1), game.levelIndex);
        return;
      }
      startTimer(); render();
    }, 1600);
  }

  function onTimeout() {
    var q = game.current;
    if (!q || game.finished) return finishGame();    // le chrono a sonné après la fin : on sort proprement
    game.__lastOptions = game.options.slice();
    var r = E.timeout(game);
    revealed = { answer: q.answer, given: null };
    after(r, q, 'Temps écoulé — la réponse était <b>' + esc(q.answer) + '</b>. ' +
      (game.mode === 'detente' ? 'On enchaîne.' :
        (r.lost ? '−' + r.lost + ' point' + (r.lost > 1 ? 's' : '') + ', place conservée.' : 'Aucun point à perdre.')));
  }

  function after(r, q, text) {
    stopTimer();
    lastQ = q;                                      // pour pouvoir afficher le retour même si
    mcOpen = false; draft = '';                     // le moteur a déjà clos la partie
    var delta = r.points ? r.points : (r.lost ? -r.lost : 0);
    feedback = { good: !!r.correct, text: text, delta: delta };
    if (r.correct) sfx.good();
    else if (r.demoted) sfx.demote();
    else if (r.mode === 'timeout') sfx.timeout();
    else if (r.event === 'resetToFirst') sfx.heart();
    else sfx.bad();
    if (r.bonus) setTimeout(sfx.bonus, 420);
    saveSeen(game.seen);          // mémoire des questions vues, d'une partie à l'autre
    autoSave();                   // et sauvegarde de la partie en cours
    render();
    setTimeout(function () {
      feedback = null; revealed = null;
      if (game.finished) return finishGame();
      if (game.mode === 'bac' && (r.event === 'levelUp' || r.event === 'demoted')) {
        game.__bonusShown = r.bonus || null;
        mapNote = r.event === 'demoted' ? 'demote' : null;
        view = 'map';
        if (r.event === 'levelUp') sfx.levelup();
        runReveal(r.event === 'demoted' ? game.levelIndex + 1 : Math.max(0, game.levelIndex - 1), game.levelIndex);
        return;
      }
      startTimer(); render();
    }, r.correct ? 1000 : 2200);
  }

  /** Fin de partie : on enregistre le score, puis diplôme ou écran de fin. */
  function finishGame() {
    stopTimer();
    if (game.__submitted) {                         // déjà fait : on ne réenregistre pas
      view = game.mode === 'detente' ? 'endRelax' : (game.won ? 'diploma' : 'endBac');
      return render();
    }
    game.__submitted = true;
    S.clearSlot();                // la partie est terminée : plus rien à reprendre
    // enregistrement et son isolés : s'ils échouent, l'écran de fin s'affiche quand même
    try {
      saveSeen(game.seen);
      S.submit({
        pseudo: S.getPseudo(), score: game.score, mode: game.mode === 'bac' ? 'bac' : 'detente',
        level: game.mode === 'bac' ? ALL_LEVELS[Math.min(game.levelIndex, ALL_LEVELS.length - 1)] : null,
        seconds: E.progress(game).spent
      });
    } catch (e) { /* score non enregistré, la partie reste jouable */ }
    try { sfx.win(); } catch (e) { /* son indisponible */ }
    view = game.mode === 'detente' ? 'endRelax' : (game.won ? 'diploma' : 'endBac');
    render();
  }

  function startTimer() {
    stopTimer();
    if (!game || game.finished) return;
    var last = Date.now();
    tick = setInterval(function () {
      if (!game || game.finished || !game.current || view !== 'play') { stopTimer(); return; }
      var now = Date.now(); game.timeLeft -= (now - last) / 1000; last = now;
      if (game.timeLeft <= 0) { game.timeLeft = 0; stopTimer(); return onTimeout(); }
      var bar = document.querySelector('.timer > i'), lbl = document.querySelector('.timer + .between small');
      if (bar) {
        bar.style.width = (game.timeLeft / game.config.timerSeconds * 100) + '%';
        bar.parentNode.className = 'timer ' + (game.timeLeft <= 5 ? 'crit' : (game.timeLeft <= 10 ? 'low' : ''));
      }
      if (lbl) lbl.textContent = Math.ceil(game.timeLeft) + ' s';
    }, 100);
  }
  function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }

  // ------------------------------------------------------------------ dictée
  function dictate() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('La dictée n\'est pas disponible dans ce navigateur.\nDans l\'app mobile, elle utilisera le moteur natif iOS / Android.'); return; }
    var rec = new SR();
    var subject = game.mode === 'bac' ? E.progress(game).subject : '';
    rec.lang = subject === 'Anglais' ? 'en-US' : 'fr-FR';
    rec.interimResults = false; rec.maxAlternatives = 1;
    recognizing = true; render();
    rec.onresult = function (e) { draft = e.results[0][0].transcript; recognizing = false; render(); };
    rec.onerror = rec.onend = function () { if (recognizing) { recognizing = false; render(); } };
    rec.start();
  }

  // sur téléphone, passer l'app en arrière-plan met le chrono en pause plutôt que de le laisser
  // filer : au retour, le joueur reprend là où il en était
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopTimer(); return; }
    if (view === 'play' && game && !game.finished && game.current && !feedback) startTimer();
  });

  S.flush();          // envoie les scores restés en attente
  render();
})();
</script>
</body>
</html>
