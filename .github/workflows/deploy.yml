name: Tests et publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # permet aussi de lancer la publication à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Vérifier et construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests des règles du jeu
        run: node tests.js

      - name: Audit de la banque de questions
        run: node tools/audit.js

      - name: Parcours complet de l'interface
        run: node tools/uitest.js

      - name: Construire prototype.html et web/
        run: node build.js

      - uses: actions/configure-pages@v5
        with:
          enablement: true        # active GitHub Pages si ce n'est pas déjà fait

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: Publier
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
