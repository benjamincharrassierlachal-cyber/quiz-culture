  // ---------------------------------------------------------------- défis
  /* Un défi oppose deux joueurs sur la même liste de questions : c'est la graine du tirage
   * qui l'assure. L'historique des questions vues est donc volontairement ignoré — sinon les
   * deux files divergeraient, chacun n'ayant pas vu les mêmes questions.
   * Les scores de défi n'entrent pas au classement : ce sont deux compétitions distinctes. */

  function icoDefi() {
    return '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/>' +
      '<path d="M19 3h2v2l-8.5 8.5"/></svg>';
  }

  /* Deux compteurs distincts, deux couleurs : le rouge appelle une action — on te défie —
   * le vert n'annonce qu'une nouvelle à lire. Confondus, le joueur ne sait pas s'il doit jouer. */
  function nDefiRecus() {
    return (defis || []).filter(function (d) {
      return d.etat === 'en attente' && d.role === 'cible';
    }).length;
  }
  function nDefiResultats() {
    return (defis || []).filter(function (d) { return d.etat !== 'en attente'; }).length;
  }
  function nDefis() { return defis ? defis.length : 0; }

  function bilanCourt() {
    var b = defiBilan;
    if (!b) return 'Un contre un';
    return b.gagnes + ' gagné' + (b.gagnes > 1 ? 's' : '') +
           ' · ' + b.perdus + ' perdu' + (b.perdus > 1 ? 's' : '');
  }
  var defiBilan = null;

  var defiErreur = null;

  /* Recharge la boîte et le bilan. Les deux appels sont séparés : réunis dans un Promise.all,
   * l'échec de l'un masquait le résultat de l'autre — et surtout, une erreur silencieuse
   * donnait une page vide impossible à diagnostiquer. */
  function chargerDefis(apres) {
    if (!S.configured()) { defis = []; defiBilan = null; defiErreur = 'classement hors ligne';
      if (apres) apres(); else render(); return; }
    defiErreur = null;
    var reste = 2;
    var fini = function () { if (--reste === 0) { if (apres) apres(); else render(); } };
    S.defiBoite().then(function (rows) { defis = rows; fini(); },
      function (e) { defis = defis || []; defiErreur = 'boîte : ' + (e && e.message || e); fini(); });
    S.defiBilan().then(function (b) { defiBilan = b; fini(); },
      function (e) { defiErreur = (defiErreur ? defiErreur + ' · ' : '') + 'bilan : ' + (e && e.message || e); fini(); });
  }

  function openDefis() {
    if (!S.pseudoValid(S.getPseudo())) {
      return askPseudo(function () { if (S.pseudoValid(S.getPseudo())) openDefis(); });
    }
    view = 'defis'; defiChoix = null; render();
    chargerDefis();
  }

  function renderDefis() {
    var recus = (defis || []).filter(function (d) { return d.etat === 'en attente' && d.role === 'cible'; });
    var resultats = (defis || []).filter(function (d) { return d.etat !== 'en attente'; });
    var b = defiBilan;
    app.innerHTML =
      '<div class="card">' + infoBtn() +
        '<h1 class="center">Défi</h1>' +
        '<p class="center muted" style="margin-top:0">Mode détente · 30 questions · ' +
          'la même liste pour les deux joueurs</p>' +

        '<button class="choice defi-tuile lancer" id="d-lancer"><b>Défier un joueur</b>' +
          '<small>Tu joues d\'abord, il relève ensuite.</small></button>' +

        '<button class="choice defi-tuile relever" id="d-relever"' + (recus.length ? '' : ' disabled') + '>' +
          '<b>Relever un défi' + (recus.length ? ' (' + recus.length + ')' : '') + '</b>' +
          '<small>' + (recus.length ? 'On t\'attend au tournant.' : 'Aucun défi pour l\'instant.') +
          '</small></button>' +

        (resultats.length ? '<div class="rank-head">À consulter</div>' +
          resultats.map(ligneResultat).join('') : '') +

        '<button class="choice" id="d-histo"><b>Historique des défis</b>' +
          '<small>Tous tes duels, du plus récent au plus ancien.</small></button>' +

        (b ? '<div class="rank-head">Mon bilan</div><table class="rank">' +
          '<tr><td>Défis gagnés</td><td class="s">' + b.gagnes + '</td></tr>' +
          '<tr><td>Défis perdus</td><td class="s">' + b.perdus + '</td></tr>' +
          '<tr><td>Défis refusés</td><td class="s">' + b.refuses + '</td></tr>' +
          '<tr><td>En attente de réponse</td><td class="s">' + b.attente + '</td></tr>' +
          '</table>' : '<p class="center muted">Chargement…</p>') +

        (defiErreur ? '<div class="oops">Le serveur a répondu : ' + esc(defiErreur) + '</div>' : '') +
        '<div class="hint center">Ton numéro : <b>' + esc(S.getTag()) + '</b> · ' +
          (defis === null ? 'chargement…' : defis.length + ' élément(s) reçu(s)') +
          ' <button class="chip" id="d-refresh">Actualiser</button></div>' +
        '<button class="btn ghost" id="menu">Menu</button>' +
      '</div>';
    document.getElementById('info').onclick = openRules;
    document.getElementById('d-refresh').onclick = function () { defis = null; defiLu = 0; render(); chargerDefis(); };
    document.getElementById('d-lancer').onclick = function () {
      advQ = ''; advTrouve = null; view = 'defiChoix'; render(); chargerAdversaires();
    };
    document.getElementById('d-histo').onclick = function () {
      histo = null; view = 'defiHisto'; render();
      S.defiHistorique(80).then(function (r) { histo = r; if (view === 'defiHisto') render(); },
        function (e) { histo = []; histoErr = String(e && e.message || e); if (view === 'defiHisto') render(); });
    };
    var dr = document.getElementById('d-relever');
    if (recus.length) dr.onclick = function () { view = 'defiRecu'; render(); };
    document.getElementById('menu').onclick = function () { defiLu = 0; view = 'modes'; render(); };
    resultats.forEach(function (d) {
      var el = document.getElementById('vu-' + d.id);
      if (el) el.onclick = function () { S.defiVu(d.id).then(function () { chargerDefis(); }, function () { chargerDefis(); }); };
    });
  }

  function ligneResultat(d) {
    var issue, cls;
    if (d.etat === 'refuse') { issue = 'Refusé'; cls = 'nul'; }
    else if (d.etat === 'expire') { issue = 'Expiré'; cls = 'nul'; }
    else if (d.etat === 'abandonne' && d.mon_score === null) { issue = 'Abandon'; cls = 'perdu'; }
    else {
      var gagne = S.defiGagne(d.mon_score, d.mes_secondes, d.son_score, d.ses_secondes);
      issue = gagne ? 'Victoire' : 'Défaite'; cls = gagne ? 'gagne' : 'perdu';
    }
    return '<div class="defi-res ' + cls + '">' +
      '<span><b>' + esc(d.adversaire) + '</b> <span class="muted">#' + esc(d.adversaire_masque) + '</span>' +
        (d.son_score !== null && d.mon_score !== null
          ? '<br><span class="muted" style="font-size:12px">' + d.mon_score + ' pts contre ' + d.son_score + '</span>'
          : '') +
      '</span><span class="issue">' + issue + '</span>' +
      '<button class="chip" id="vu-' + d.id + '">OK</button></div>';
  }

  /** Choix de l'adversaire : les joueurs du classement détente, ou une saisie manuelle. */
  var advListe = null;
  function chargerAdversaires() {
    if (advListe) return;
    S.top('detente', 100).then(function (res) {
      var vus = {}, moi = S.getTag();
      advListe = (res.rows || []).filter(function (r) {
        if (!r.tag || r.tag === moi) return false;
        var k = r.pseudo + '#' + r.tag;
        if (vus[k]) return false;
        vus[k] = 1; return true;
      }).slice(0, 40).map(function (r) {
        return { pseudo: r.pseudo, masque: S.maskTag(r.tag), score: r.score };
      });
      if (view === 'defiChoix') majListeAdv();
    }, function () { advListe = []; if (view === 'defiChoix') majListeAdv(); });
  }

  var advQ = '', advTrouve = null, advCherche = 0;

  /* Recherche d'adversaire. Deux sources complémentaires : le classement déjà chargé, filtré
   * instantanément à la frappe, et le serveur, qui connaît aussi les joueurs n'ayant jamais
   * publié de score. Deux caractères minimum côté serveur, pour ne pas servir l'annuaire. */
  function advFiltre() {
    var q = advQ.trim().toLowerCase();
    var vus = {}, sortie = [];
    var ajoute = function (a) {
      var k = a.pseudo.toLowerCase() + '#' + a.masque;
      if (vus[k]) return;
      vus[k] = 1; sortie.push(a);
    };
    (advListe || []).forEach(function (a) {
      if (!q || a.pseudo.toLowerCase().indexOf(q) === 0) ajoute(a);
    });
    (advTrouve || []).forEach(ajoute);
    return sortie.slice(0, 30);
  }

  function chercherAdversaire() {
    var q = advQ.trim();
    if (q.length < 2) { advTrouve = null; return majListeAdv(); }
    var mien = ++advCherche;
    S.defiChercher(q, 20).then(function (rows) {
      if (mien !== advCherche || view !== 'defiChoix') return;      // frappe plus récente
      var moi = S.maskTag(S.getTag());
      advTrouve = rows.filter(function (r) { return r.masque !== moi; })
        .map(function (r) { return { pseudo: r.pseudo, masque: r.masque }; });
      majListeAdv();
    }, function () { if (mien === advCherche) { advTrouve = []; majListeAdv(); } });
  }

  /* Ne redessine QUE la liste des résultats. Repasser par render() reconstruisait la carte
   * entière à chaque lettre : le champ de saisie était détruit et recréé, donc le clavier
   * du téléphone se refermait à chaque frappe. */
  function majListeAdv() {
    var zone = document.getElementById('adv-liste');
    if (!zone) return;
    var liste = advFiltre();
    zone.innerHTML = liste.length
      ? '<div class="rank-wrap">' + liste.map(function (a, i) {
          return '<button class="acc-row" id="adv-' + i + '">' +
            '<span>' + esc(a.pseudo) + ' <span class="muted">#' + esc(a.masque) + '</span></span>' +
            '<span class="muted">' + (a.score !== undefined ? a.score + ' pts' : 'défier') + '</span></button>';
        }).join('') + '</div>'
      : '<p class="center muted">' + (advQ.trim().length >= 2
          ? 'Aucun joueur à ce nom.'
          : (advListe === null ? 'Chargement…' : 'Tape deux lettres pour chercher.')) + '</p>';
    liste.forEach(function (a, i) {
      var el = document.getElementById('adv-' + i);
      if (el) el.onclick = function () { lancerDefi(a); };
    });
  }

  function renderDefiChoix() {
    app.innerHTML =
      '<div class="card">' + infoBtn() +
        '<h1 class="center">Qui veux-tu défier ?</h1>' +
        '<div class="hint center">Ta partie se lance aussitôt. Impossible de recommencer : ' +
          'abandonner compte comme une défaite.</div>' +
        '<input type="text" id="adv-q" maxlength="14" autocomplete="off" ' +
          'placeholder="Tape les premières lettres du pseudo" value="' + esc(advQ) + '">' +
        '<div id="adv-liste"></div>' +
        '<button class="btn ghost" id="back">Retour</button>' +
      '</div>';
    document.getElementById('info').onclick = openRules;
    document.getElementById('back').onclick = function () { view = 'defis'; render(); };
    var champ = document.getElementById('adv-q');
    if (champ) {
      champ.oninput = function () {
        advQ = champ.value;
        majListeAdv();                                    // filtre local : instantané
        clearTimeout(champ._t);
        champ._t = setTimeout(chercherAdversaire, 280);    // serveur : après une pause de frappe
      };
      if (!('ontouchstart' in window)) champ.focus();
    }
    majListeAdv();
  }

  /** Je défie : ma partie démarre immédiatement, sur la graine la plus fraîche trouvée. */
  function lancerDefi(adv) {
    defiChoix = adv;
    startDefi({ role: 'lanceur', seed: graineFraiche(), adversaire: adv.pseudo, masque: adv.masque });
  }


  var histo = null, histoErr = null;

  /** Historique : une ligne par duel, « Guillaume 32 — Benji 45 », gagnant en vert. */
  function renderDefiHisto() {
    var moi = S.getPseudo() || 'Moi';
    var corps;
    if (histo === null) corps = '<p class="center muted">Chargement…</p>';
    else if (!histo.length) corps = '<p class="center muted">Aucun défi terminé pour l\'instant.</p>';
    else corps = '<div class="rank-wrap">' + histo.map(function (d) {
      var jeGagne = null;                       // null = ni victoire ni défaite (refus, expiration)
      if (d.etat === 'releve') {
        jeGagne = S.defiGagne(d.mon_score, d.mes_secondes, d.son_score, d.ses_secondes);
      } else if (d.etat === 'abandonne') {
        jeGagne = d.abandon_par !== d.je_suis ? true : false;
        if (d.abandon_par === 'lanceur' && d.je_suis === 'cible') jeGagne = null;  // il a renoncé avant moi
      }
      var moiCl = jeGagne === null ? 'nul' : (jeGagne ? 'gagne' : 'perdu');
      var luiCl = jeGagne === null ? 'nul' : (jeGagne ? 'perdu' : 'gagne');
      var sc = function (v) { return (v === null || v === undefined) ? '—' : v; };
      var note = d.etat === 'refuse' ? 'refusé' : (d.etat === 'expire' ? 'expiré'
                 : (d.etat === 'abandonne' ? 'abandon' : ''));
      return '<div class="histo-l">' +
        '<span class="j ' + luiCl + '">' + esc(d.son_pseudo) + ' <b>' + sc(d.son_score) + '</b></span>' +
        '<span class="vs">—</span>' +
        '<span class="j ' + moiCl + '"><b>' + sc(d.mon_score) + '</b> ' + esc(moi) + '</span>' +
        (note ? '<span class="note">' + note + '</span>' : '') +
      '</div>';
    }).join('') + '</div>';

    app.innerHTML =
      '<div class="card">' + infoBtn() +
        '<h1 class="center">Historique</h1>' +
        (histoErr ? '<div class="oops">' + esc(histoErr) + '</div>' : '') +
        corps +
        '<div class="hint center">En vert le vainqueur, en rouge le vaincu. ' +
          'À score égal, c\'est le temps qui départage.</div>' +
        '<button class="btn ghost" id="back">Retour</button>' +
      '</div>';
    document.getElementById('info').onclick = openRules;
    document.getElementById('back').onclick = function () { view = 'defis'; render(); };
  }

  /** Page « on te défie » : un défi par écran, accepter ou refuser. */
  function renderDefiRecu() {
    var recus = (defis || []).filter(function (d) { return d.etat === 'en attente' && d.role === 'cible'; });
    if (!recus.length) { view = 'defis'; return render(); }
    var d = recus[0];
    app.innerHTML =
      '<div class="card center">' + infoBtn() +
        '<h1>Tu es défié !</h1>' +
        '<div class="defi-qui"><span class="avatar big"><svg width="34" height="40" viewBox="0 0 12 16">' +
          sprite(1, 0) + '</svg></span>' +
          '<div><b>' + esc(d.adversaire) + '</b> <span class="muted">#' + esc(d.adversaire_masque) + '</span>' +
          '<br><span class="muted" style="font-size:13px">t\'a lancé un défi</span></div></div>' +
        '<p class="muted">Tu joueras <b>exactement les mêmes 30 questions</b> que lui. ' +
          'Son score ne te sera révélé qu\'à la fin.</p>' +
        '<div class="hint">Ni pause salvatrice ni redémarrage : abandonner, c\'est perdre.</div>' +
        '<button class="btn go" id="d-ok">Accepter et jouer</button>' +
        '<button class="btn ghost" id="d-no">Refuser</button>' +
        (recus.length > 1 ? '<div class="hint">' + (recus.length - 1) + ' autre(s) défi(s) après celui-ci.</div>' : '') +
        '<button class="btn ghost" id="back">Retour</button>' +
        '<div class="hint">Revenir en arrière ne décide de rien : le défi t\'attend 7 jours. ' +
          'Refuser, en revanche, est définitif et apparaîtra dans ton bilan.</div>' +
      '</div>';
    document.getElementById('info').onclick = openRules;
    document.getElementById('back').onclick = function () { view = 'defis'; render(); };
    document.getElementById('d-ok').onclick = function () {
      startDefi({ role: 'cible', id: d.id, seed: d.seed, adversaire: d.adversaire,
                  masque: d.adversaire_masque, sonScore: d.son_score, sesSecondes: d.ses_secondes });
    };
    document.getElementById('d-no').onclick = function () {
      var fin = function () { defis = null; defiLu = 0; view = 'defis'; render(); chargerDefis(); };
      S.defiRepondre(d.id, false).then(fin, fin);
    };
  }

  /** Partie de défi : graine imposée, historique ignoré, pas de reprise possible. */
  function startDefi(info) {
    game = E.createRelax(RELAX, { seed: info.seed });     // sans « seen » : même file pour les deux
    game.defi = info;
    feedback = null; revealed = null; mcOpen = false; draft = ''; anim = null; lastQ = null;
    jokersAnnounced = false; speedAnnounced = false; defiFin = null;
    S.clearSlot();                                        // un défi ne se met pas de côté
    view = 'play'; startTimer(); render();
  }

  /** Fin d'une partie de défi : on dépose le résultat, puis on annonce l'issue. */
  function terminerDefi(abandon) {
    var d = game.defi, score = abandon ? 0 : game.score;
    var secondes = E.progress(game).spent;
    var fini = function () { view = 'defiFin'; render(); };
    if (d.role === 'lanceur') {
      defiFin = { role: 'lanceur', abandon: abandon, adversaire: d.adversaire, masque: d.masque,
                  score: score, secondes: secondes };
      S.defiLancer(d.adversaire, d.masque, score, secondes, d.seed, abandon)
        .then(fini, function (e) {
          defiFin.erreur = String(e && e.message || e);
          fini();
        });
    } else {
      var gagne = !abandon && S.defiGagne(score, secondes, d.sonScore, d.sesSecondes);
      defiFin = { role: 'cible', abandon: abandon, adversaire: d.adversaire, masque: d.masque,
                  score: score, secondes: secondes, sonScore: d.sonScore,
                  sesSecondes: d.sesSecondes, gagne: gagne };
      S.defiRepondre(d.id, true, score, secondes, abandon).then(fini, function (e) {
        defiFin.erreur = String(e && e.message || e);
        fini();
      });
    }
    game.__submitted = true;
    stopTimer();
  }

  function renderDefiFin() {
    var f = defiFin || {};
    var adv = esc(f.adversaire || '') + ' <span class="muted">#' + esc(f.masque || '') + '</span>';
    var corps, titre, cls = '';

    if (f.erreur) {
      titre = 'Résultat non enregistré';
      corps = '<p class="muted">' + esc(f.erreur) + '</p>' +
        '<div class="hint">Ton score n\'a pas pu partir. Vérifie ta connexion, le défi reste ouvert.</div>';
    } else if (f.role === 'lanceur') {
      titre = f.abandon ? 'Défi abandonné' : 'Défi envoyé !';
      corps = f.abandon
        ? '<p class="muted">Un abandon compte comme une défaite. ' + adv + ' n\'en saura rien.</p>'
        : '<p class="muted">' + adv + ' doit maintenant battre ton score.</p>' +
          recapDefi(f.score, f.secondes, null, null, f.adversaire);
    } else if (f.abandon) {
      titre = 'Défaite'; cls = 'perdu';
      corps = '<p class="muted">Abandonner un défi, c\'est le perdre. ' + adv + ' l\'emporte.</p>';
    } else {
      titre = f.gagne ? 'VICTOIRE 🏆' : 'DÉFAITE';
      cls = f.gagne ? 'gagne' : 'perdu';
      corps = '<p class="muted">' + (f.gagne ? 'Tu as battu ' : 'Tu t\'es fait battre par ') + adv + '.</p>' +
        recapDefi(f.score, f.secondes, f.sonScore, f.sesSecondes, f.adversaire);
    }

    app.innerHTML =
      '<div class="card center ' + cls + '">' + infoBtn() +
        '<h1 class="defi-titre ' + cls + '">' + titre + '</h1>' +
        corps +
        '<div class="hint">Les scores de défi ne comptent pas dans le classement.</div>' +
        (f.adversaire && !f.erreur
          ? '<button class="btn go" id="revanche">⚔ Prendre ma revanche</button>' : '') +
        '<button class="btn ghost" id="next">Mes défis</button>' +
        '<button class="btn ghost" id="menu">Menu</button>' +
      '</div>';
    document.getElementById('info').onclick = openRules;
    var rv = document.getElementById('revanche');
    if (rv) rv.onclick = function () {
      startDefi({ role: 'lanceur', seed: graineFraiche(),
                  adversaire: f.adversaire, masque: f.masque });
    };
    document.getElementById('next').onclick = function () { defis = null; defiLu = 0; openDefis(); };
    document.getElementById('menu').onclick = function () { defiLu = 0; view = 'modes'; render(); };
  }

  /** Tableau des deux performances : score et temps, côte à côte. */
  function recapDefi(monScore, mesSec, sonScore, sesSec, adversaire) {
    var ligne = function (qui, sc, se, fort) {
      return '<tr' + (fort ? ' class="me"' : '') + '><td>' + qui + '</td>' +
        '<td class="s">' + sc + ' pts</td>' +
        '<td class="s">' + clock(se || 0) + '</td></tr>';
    };
    return '<table class="rank" style="margin-top:12px">' +
      ligne('Toi', monScore, mesSec, true) +
      (sonScore === null || sonScore === undefined ? '' : ligne(esc(adversaire), sonScore, sesSec, false)) +
      '</table>' +
      (sonScore !== null && sonScore !== undefined && monScore === sonScore
        ? '<div class="hint">Scores identiques : c\'est le temps qui départage.</div>' : '');
  }


  /** Trois aides à 6 points, une fois chacune, à partir de la 6ème. */
  function jokerBar(p) {
    var list = [
      { k: 'fifty', label: '40/60', hint: '3 fausses barrées' },
      { k: 'swap', label: 'Changer', hint: 'autre question' },
      { k: 'pass', label: 'Passer', hint: 'sans point' }
    ];
    return '<div class="jokers">' + list.map(function (j) {
      var used = !p.jokers[j.k];
      var can = !used && p.score >= p.jokerCost && !(j.k === 'fifty' && p.hiddenWrong.length);
      return '<div class="jk' + (used ? ' spent' : '') + '">' +
        '<button class="joker" data-joker="' + j.k + '"' + (can ? '' : ' disabled') +
          ' aria-label="' + j.label + ' : ' + j.hint + ', ' + p.jokerCost + ' points">' +
          JOKER_ICONS[j.k] + '</button>' +
        '<b>' + j.label + (used ? '</b><small>utilisé</small>' : '</b>') +
      '</div>';
    }).join('') + '</div>';
  }

  function renderMap() {
    var castle = game.levelIndex >= ALL_LEVELS.length;
    var target = anim ? anim.to : Math.min(game.levelIndex, ALL_LEVELS.length);
    var pawn = anim ? animPawn() : Object.assign({ frame: 0, hop: 0 }, pos(target));
    var down = !!(anim && anim.to < anim.from) || mapNote === 'demote';
    var title = down ? 'Plus de cœur… 💔' : (castle ? 'Château atteint ! 🏰' : 'Classe validée ! 🎉');
    var sub = down ? 'Tu redescends en <b>' + esc(ALL_LEVELS[Math.min(target, ALL_LEVELS.length - 1)]) + '</b>, avec 3 cœurs neufs.' : '';
    var bonus = game.__bonusShown;
    app.innerHTML =
      '<div class="card center">' + infoBtn() +
        '<h1>' + title + '</h1>' +
        (sub ? '<p class="muted">' + sub + '</p>' : '') +
        (bonus ? '<p><span class="tag">Classe parfaite : ' +
          (bonus.kind === 'life' ? '+' + bonus.amount + ' vie' : '+' + bonus.amount + ' points') + '</span></p>' : '') +
        mapSvg(pawn) +
        '<div class="between" style="margin-top:14px">' +
          '<div class="scorebar"><span class="lbl">SCORE</span>' + coins(3) + '<span class="val">' + game.score + '</span></div>' +
          hearts(game.lives, Math.max(3, game.lives)) +
        '</div>' +
        '<button class="btn go" id="next">Continuer</button>' +
      '</div>';
    document.getElementById('info').onclick = openRules;
    var nx = document.getElementById('next');
    nx.onclick = function () {
      mapNote = null; game.__bonusShown = null;
      if (!jokersAnnounced && E.progress(game).jokersOpen) {   // entrée en 6ème : les jokers s'ouvrent
        jokersAnnounced = true;
        view = 'jokers'; return render();
      }
      view = 'play'; startTimer(); render();
    };
    if (anim) nx.disabled = true;
  }
  var mapNote = null;

  /** Diplôme du BAC : parchemin, pseudo, score. */
  function diplomaSvg(pseudo, score, max) {
    var pct = Math.round(score / max * 100);
    var mention = pct >= 90 ? 'Mention très bien' : (pct >= 75 ? 'Mention bien' : (pct >= 60 ? 'Mention assez bien' : 'Admis'));
    var date = new Date().toLocaleDateString('fr-FR');
    return '<div class="diploma"><svg viewBox="0 0 320 210" xmlns="http://www.w3.org/2000/svg">' +
      '<rect width="320" height="210" fill="#fdf6e3"/>' +
      '<rect x="8" y="8" width="304" height="194" fill="none" stroke="#c9a227" stroke-width="4"/>' +
      '<rect x="15" y="15" width="290" height="180" fill="none" stroke="#2a2140" stroke-width="2"/>' +
      '<text x="160" y="40" text-anchor="middle" font-size="10" font-weight="700" fill="#7a6f8c" letter-spacing="2">RÉPUBLIQUE DU QUIZZ</text>' +
      '<text x="160" y="72" text-anchor="middle" font-size="26" font-weight="900" fill="#2a2140">BACCALAURÉAT</text>' +
      '<text x="160" y="92" text-anchor="middle" font-size="11" fill="#7a6f8c">décerné à</text>' +
      '<text x="160" y="118" text-anchor="middle" font-size="22" font-weight="800" fill="#2f6bff">' + esc(pseudo || 'Anonyme') + '</text>' +
      '<text x="160" y="143" text-anchor="middle" font-size="15" font-weight="800" fill="#2a2140">' +
        score + ' / ' + max + ' points</text>' +
      '<text x="160" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#c9a227">' + mention + '</text>' +
      '<text x="160" y="182" text-anchor="middle" font-size="10" fill="#7a6f8c">le ' + date + '</text>' +
      '<g transform="translate(274,154)"><circle r="20" fill="#ff5566" stroke="#2a2140" stroke-width="3"/>' +
        '<circle r="13" fill="none" stroke="#fff" stroke-width="2"/>' +
        '<path d="M-6 0 L-2 5 L7 -5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>' +
      '<g transform="translate(26,138) scale(1.25)">' + sprite(2, 0) + '</g>' +
      '</svg></div>';
  }

  function renderDiploma() {
    var max = E.maxScore(BANK);
    app.innerHTML =
      '<div class="card center">' + infoBtn() +
        '<h1>Bravo, tu as le BAC ! 🎓</h1>' +
        diplomaSvg(S.getPseudo(), game.score, max) +
        '<div style="margin-top:14px;text-align:left">' +
          '<div class="kv"><span class="muted">Score</span><b>' + game.score + ' / ' + max + '</b></div>' +
          '<div class="kv"><span class="muted">Temps de jeu</span><b>' + clock(E.progress(game).spent) + '</b></div>' +
          '<div class="kv"><span class="muted">Questions jouées</span><b>' +
            ((game.answeredBefore || 0) + game.log.length) + '</b></div>' +
          '<div class="kv"><span class="muted">Cœurs restants</span><b>' + game.lives + '</b></div>' +
        '</div>' +
        '<button class="btn go" id="next">Suivant : le classement</button>' +
        '<button class="btn ghost" id="menu">Menu</button>' +
      '</div>';
    document.getElementById('info').onclick = openRules;
    document.getElementById('next').onclick = function () { openRanking('bac'); };
    document.getElementById('menu').onclick = function () { published = null; view = 'modes'; render(); };
  }

  function renderEndBac() {
    app.innerHTML =
      '<div class="card center">' + infoBtn() +
        '<h1>Partie terminée</h1>' +
        '<p class="muted">La banque de questions s\'arrête ici pour cette classe. Le chemin continuera dans la prochaine mise à jour.</p>' +
        '<div class="row" style="justify-content:center;gap:10px;margin:12px 0 4px">' + coins(3) +
          '<span class="big">' + game.score + '</span></div><small class="muted">points</small>' +
        '<button class="btn go" id="again">Rejouer</button>' +
        '<button class="btn ghost" id="menu">Menu</button>' +
      '</div>';
    document.getElementById('info').onclick = openRules;
    document.getElementById('again').onclick = function () { startMode('bac'); };
    document.getElementById('menu').onclick = function () { published = null; view = 'modes'; render(); };
  }

  function renderEndRelax() {
    var max = game.queue.length * E.CONFIG.pointsFree;
    app.innerHTML =
      '<div class="card center">' + infoBtn() +
        '<h1>Quizz terminé 🌿</h1>' +
        '<div class="row" style="justify-content:center;gap:10px;margin:14px 0 4px">' + coins(3) +
          '<span class="big">' + game.score + '</span></div>' +
        '<small class="muted">points sur ' + max + '</small>' +
        '<div style="margin-top:16px;text-align:left">' +
          '<div class="kv"><span class="muted">Bonnes réponses</span><b>' + game.correctCount + ' / ' + game.queue.length + '</b></div>' +
          '<div class="kv"><span class="muted">Temps de jeu</span><b>' + clock(E.progress(game).spent) + '</b></div>' +
          '<div class="kv"><span class="muted">Ton record</span><b>' + S.best('detente') + '</b></div>' +
        '</div>' +
        '<button class="btn go" id="again">Rejouer</button>' +
        '<button class="btn ghost" id="rank">Classement</button>' +
        '<button class="btn ghost" id="menu">Menu</button>' +
      '</div>';
    document.getElementById('info').onclick = openRules;
    document.getElementById('again').onclick = function () { startMode('detente'); };
    document.getElementById('rank').onclick = function () { openRanking('detente'); };
    document.getElementById('menu').onclick = function () { published = null; view = 'modes'; render(); };
  }

  function openRanking(mode, onlyMine) {
    rank = { mode: mode, loading: true, rows: [], source: null, onlyMine: !!onlyMine };
    view = 'ranking'; render();
    S.top(mode, 200).then(function (res) {
      rank = { mode: mode, loading: false, rows: res.rows, source: res.source, onlyMine: !!onlyMine };
      if (view === 'ranking') render();
    });
  }

  /** Une ligne du classement. */
  /** Place la zone défilante sur ma ligne, avec au moins deux voisins visibles
   *  au-dessus et au-dessous. Sans ma ligne, on reste sur les premiers. */
  function centreSurMoi() {
    var wrap = document.getElementById('rank-wrap');
    var mine = document.getElementById('me-row');
    if (!wrap || !mine) return;
    var h = mine.offsetHeight || 44;
    var cible = mine.offsetTop - (wrap.clientHeight - h) / 2;   // ma ligne au centre
    var max = wrap.scrollHeight - wrap.clientHeight;            // sans dépasser le bas
    wrap.scrollTop = Math.max(0, Math.min(cible, max));
  }

  /** Une seule ligne par joueur : sa meilleure partie, la plus rapide en cas d'égalité.
   *  La liste reçue doit déjà être triée par S.byScoreThenTime — le premier vu est donc
   *  le meilleur. Sans cela, dix tentatives d'un même pseudo remplissent le classement. */
  function meilleurParJoueur(triees) {
    var vus = {}, sortie = [];
    triees.forEach(function (r) {
      var cle = r.tag ? ('#' + r.tag) : ('@' + String(r.pseudo || '').toLowerCase());
      if (vus[cle]) return;
      vus[cle] = true;
      sortie.push(r);
    });
    return sortie;
  }

  function isMine(r, me, myTag) {
    return r.pseudo === me && (!r.tag || r.tag === myTag);
  }

  function rankRow(r, i, me, myTag) {
    var mine = isMine(r, me, myTag);
    var medal = i === 0 ? '🥇 ' : (i === 1 ? '🥈 ' : (i === 2 ? '🥉 ' : ''));
    // la première ligne qui est la mienne sert d'ancre au défilement automatique
    if (mine && !rankMeSeen) { rankMeSeen = true; mine = ' class="me" id="me-row"'; }
    else mine = mine ? ' class="me"' : '';
    return '<tr' + mine + '><td class="n">' + medal + (i + 1) + '</td>' +
      '<td>' + esc(r.pseudo) + ' <span class="muted" style="font-weight:700">#' +
        esc(r.tag ? S.maskTag(r.tag) : '?????') + '</span>' +
      (r.seconds ? '<br><span class="muted" style="font-size:12px">⏱ ' + clock(r.seconds) + '</span>' : '') + '</td>' +
      '<td class="s">' + r.score + '</td></tr>';
  }

  function renderRanking() {
    var me = S.getPseudo(), myTag = S.getTag(), myLevel = S.lastLevel();
    var rows = (rank && rank.rows) || [];
    var body = '', place = null, total = 0;
    rankMeSeen = false;

    if (rank.mode === 'bac') {
      // regroupement par classe, de la Terminale vers le CP : on compare ce qui est comparable
      rows = rows.slice().sort(S.byScoreThenTime);
      var groups = {};
      rows.forEach(function (r) {
        var lv = r.level && ALL_LEVELS.indexOf(r.level) !== -1 ? r.level : 'Classe non précisée';
        (groups[lv] = groups[lv] || []).push(r);
      });
      var order = ALL_LEVELS.slice().reverse().concat(['Classe non précisée'])
        .filter(function (lv) { return groups[lv]; });
      if (rank.onlyMine && myLevel) order = order.filter(function (lv) { return lv === myLevel; });
      order.forEach(function (lv) {
        // une ligne par joueur et par classe : on garde sa meilleure partie dans cette classe,
        // mais il reste visible dans chacune des classes où il s'est illustré
        var list = meilleurParJoueur(groups[lv].sort(S.byScoreThenTime));
        // ma place se compte dans ma classe : c'est le classement qui a du sens
        list.forEach(function (r, i) {
          if (isMine(r, me, myTag) && place === null) { place = i + 1; total = list.length; }
        });
        body += '<div class="rank-head">' + esc(lv) + '</div><table class="rank">' +
          list.map(function (r, i) { return rankRow(r, i, me, myTag); }).join('') + '</table>';
      });
    } else {
      var list = meilleurParJoueur(rows.slice().sort(S.byScoreThenTime));
      total = list.length;
      list.forEach(function (r, i) {
        if (isMine(r, me, myTag) && place === null) place = i + 1;
      });
      body = '<table class="rank">' +
        list.map(function (r, i) { return rankRow(r, i, me, myTag); }).join('') + '</table>';
    }
    if (rows.length) body = '<div class="rank-wrap" id="rank-wrap">' + body + '</div>';

    app.innerHTML =
      '<div class="card">' + infoBtn() +
        '<h1 class="center">Classement</h1>' +
        (published ? '<p class="center"><span class="tag">Score publié : ' + published.score + ' pts' +
          (published.level ? ' en ' + esc(published.level) : '') + '</span></p>' : '') +
        '<div class="row" style="justify-content:center;gap:8px;margin:10px 0 4px;flex-wrap:wrap">' +
          '<button class="chip' + (rank.mode === 'bac' ? ' on' : '') + '" id="t-bac">Quizz BAC</button>' +
          '<button class="chip' + (rank.mode === 'detente' ? ' on' : '') + '" id="t-det">Détente</button>' +
          (rank.mode === 'bac' && myLevel
            ? '<button class="chip' + (rank.onlyMine ? ' on' : '') + '" id="t-mine">Ma classe : ' + esc(myLevel) + '</button>'
            : '') +
        '</div>' +
        (rank.loading ? '<p class="center muted">Chargement…</p>'
                      : (rows.length ? body : '<p class="center muted">Aucun score pour l\'instant. Joue une partie !</p>')) +
        (place ? '<p class="rank-pos">Tu es <span class="tag">' + place +
          (place === 1 ? 'er' : 'e') + ' sur ' + total + '</span>' +
          (rank.mode === 'bac' ? ' dans ta classe' : '') + '</p>' : '') +
        '<div class="hint center">' + (rank.source === 'online' ? 'Classement en ligne.' :
          (S.configured() ? 'Hors ligne : scores de cet appareil.' : 'Classement local à cet appareil.')) +
          (S.queued().length ? ' ' + S.queued().length + ' score(s) en attente d\'envoi.' : '') + '</div>' +
        (S.lastError() ? '<div class="oops">' + esc(S.lastError().msg) +
          '<button class="chip" id="retry">Réessayer l\'envoi</button></div>' : '') +
        '<button class="btn ghost" id="menu">Menu</button>' +
      '</div>';
    document.getElementById('info').onclick = openRules;
    centreSurMoi();
    var rt = document.getElementById('retry');
    if (rt) rt.onclick = function () {
      rt.disabled = true; rt.textContent = 'Envoi…';
      S.flush().then(function () { openRanking(rank.mode, rank.onlyMine); },
                    function () { render(); });
    };
    document.getElementById('t-bac').onclick = function () { openRanking('bac', rank.onlyMine); };
    document.getElementById('t-det').onclick = function () { openRanking('detente'); };
    var tm = document.getElementById('t-mine');
    if (tm) tm.onclick = function () { rank.onlyMine = !rank.onlyMine; render(); };
    document.getElementById('menu').onclick = function () { published = null; view = 'modes'; render(); };
  }

  // ------------------------------------------------------------------ animation carte
  function animPawn() {
    var a = pos(anim.from), b = pos(anim.to);
    if (anim.phase !== 'walk') return { x: a.x, y: a.y, frame: 0, hop: 0 };
    var t = anim.t, ease = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    return {
      x: a.x + (b.x - a.x) * ease, y: a.y + (b.y - a.y) * ease,
      hop: Math.abs(Math.sin(t * Math.PI * 3)) * 6, frame: Math.floor(t * 12) % 2
    };
  }
  var DUR = { path: 900, node: 400, walk: 1200 };
  function runReveal(from, to, done) {
    anim = { from: from, to: to, phase: to > from ? 'path' : 'walk', t: 0 };
    render();
    var last = Date.now(), soundAt = 0;
    var id = setInterval(function () {
      var now = Date.now(); anim.t += (now - last) / DUR[anim.phase]; last = now;
      if (anim.t >= 1) {
        anim.t = 0; soundAt = 0;
        if (anim.phase === 'path') { anim.phase = 'node'; sfx.popNode(); render(); return; }
        if (anim.phase === 'node') { anim.phase = 'walk'; render(); return; }
        clearInterval(id); anim = null; render();
        if (done) done();
        return;
      }
      if (anim.phase === 'path') {
        if (anim.t > soundAt) { soundAt += .14; sfx.dig(); }
        var g = document.getElementById('growing');
        if (g) {
          var L = segLen(Math.min(anim.from, anim.to));
          Array.prototype.forEach.call(g.children, function (ln) { ln.setAttribute('stroke-dashoffset', L * (1 - anim.t)); });
        } else render();
      } else if (anim.phase === 'node') {
        var n = document.getElementById('newnode');
        if (n && n.firstChild) {
          var p = pos(Math.max(anim.from, anim.to)), sc = 0.2 + 0.8 * anim.t;
          n.firstChild.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ') scale(' + sc + ') translate(' + (-p.x) + ',' + (-p.y) + ')');
        } else render();
      } else {
        if (anim.t > soundAt) { soundAt += .3; sfx.step(); }
        var pw = animPawn(), pawn = document.getElementById('pawn');
        if (pawn) {
          var px = 2.2, w = SPRITE_W * px;
          pawn.setAttribute('transform', 'translate(' + (pw.x - w / 2) + ',' + (pw.y + 4 - SPRITE_H * px) + ')');
          pawn.lastChild.setAttribute('transform', 'translate(0,' + (-pw.hop) + ')');
          pawn.lastChild.innerHTML = sprite(px, pw.frame);
        } else render();
      }
    }, 50);
  }

  // ------------------------------------------------------------------ actions
  function wirePlay() {
    var inf = document.getElementById('info'); if (inf) inf.onclick = openRules;
    var quit = document.getElementById('quit');
    if (quit) quit.onclick = function () {
      stopTimer();
      pauseCost = E.penalizePause(game);      // le chrono s'arrête, le temps de jeu non
      autoSave();
      view = 'pause'; render();
    };
    var input = document.getElementById('free');
    var form = document.getElementById('answer-form');
    if (form) form.onsubmit = function (e) { e.preventDefault(); submitFree(); };
    if (input) {
      input.value = draft;
      if (!('ontouchstart' in window)) input.focus();
      input.oninput = function () { draft = input.value; };
      input.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); submitFree(); } };
      // le clavier mobile masque le bas de l'écran : on ramène la zone de réponse dans la vue
      input.onfocus = function () {
        setTimeout(function () {
          try { input.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { /* vieux navigateur */ }
        }, 250);
      };
    }
    var openmc = document.getElementById('openmc'); if (openmc) openmc.onclick = function () { mcOpen = true; render(); };
    var mic = document.getElementById('mic'); if (mic) mic.onclick = dictate;
    Array.prototype.forEach.call(document.querySelectorAll('[data-opt]'), function (b) {
      b.onclick = function () { submitMC(game.options[+b.getAttribute('data-opt')]); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-joker]'), function (b) {
      b.onclick = function () { playJoker(b.getAttribute('data-joker')); };
    });
  }

  function submitFree() {
    var input = document.getElementById('free');
    var val = (input ? input.value : draft).trim();
    if (!val) return;
    draft = '';
    var q = game.current;
    var opts = game.options.slice();                 // /!\ à capturer AVANT de répondre :
    var r = E.answerFree(game, val);                 // le moteur passe déjà à la question suivante
    if (r.ok === false) return render();
    if (game.mode === 'detente' && !r.correct) {
      game.__lastOptions = opts;                     // on révèle la bonne réponse de CETTE question
      revealed = { answer: q.answer, given: null };
    }
    after(r, q, r.correct ? 'Bravo !'
      : '« ' + esc(val) + ' » n\'est pas la réponse. C\'était : <b>' + esc(q.answer) + '</b>.' +
        (game.mode === 'bac' ? ' Nouvelle question, en choix multiple.' : ''));
  }

  function submitMC(choice) {
    var q = game.current;
    game.__lastOptions = game.options.slice();        // avant de répondre, idem
    var r = E.answerMC(game, choice);
    if (r.ok === false) return render();
    revealed = { answer: q.answer, given: choice };
    var text;
    if (r.correct) text = 'Bien vu !';
    else if (game.mode === 'detente') text = 'Raté — la réponse était <b>' + esc(q.answer) + '</b>.';
    else if (r.demoted) text = 'Plus de cœur : tu redescends d\'une classe.';
    else text = 'Raté — retour au début de la classe, un cœur perdu' +
      (r.lost ? ' et ' + r.lost + ' point' + (r.lost > 1 ? 's' : '') + ' effacé' + (r.lost > 1 ? 's' : '') : '') + '.';
    after(r, q, text);
  }

  /** Utilisation d'un joker, avec le retour visuel qui va avec. */
  function playJoker(kind) {
    var q = game.current;
    var r = E.useJoker(game, kind);
    if (!r.ok) return render();
    sfx.buy();
    autoSave();
    if (kind === 'fifty') { mcOpen = true; return render(); }         // le QCM s'ouvre, 3 fausses barrées
    if (kind === 'swap') {
      feedback = { good: false, text: 'Question changée — ' + r.cost + ' points.', delta: -r.cost };
      stopTimer();
      render();
      setTimeout(function () { feedback = null; startTimer(); render(); }, 900);
      return;
    }
    // « passer » : on avance sans point
    stopTimer();
    feedback = { good: false, text: 'Question passée — ' + r.cost + ' points. La réponse était <b>' +
      esc(q.answer) + '</b>.', delta: -r.cost };
    render();
    setTimeout(function () {
      feedback = null;
      if (game.finished) return finishGame();
      if (r.event === 'levelUp') {
        game.__bonusShown = r.bonus || null;
        view = 'map'; sfx.levelup();
        runReveal(Math.max(0, game.levelIndex - 1), game.levelIndex);
        return;
      }
      startTimer(); render();
    }, 3000);
  }

  function onTimeout() {
    var q = game.current;
    if (!q || game.finished) return finishGame();    // le chrono a sonné après la fin : on sort proprement
    game.__lastOptions = game.options.slice();
    var r = E.timeout(game);
    revealed = { answer: q.answer, given: null };
    after(r, q, 'Temps écoulé — la réponse était <b>' + esc(q.answer) + '</b>. ' +
      (game.mode === 'detente' ? 'On enchaîne.' :
        (r.lost ? '−' + r.lost + ' point' + (r.lost > 1 ? 's' : '') + ', place conservée.' : 'Aucun point à perdre.')));
  }

  function after(r, q, text) {
    stopTimer();
    lastQ = q;                                      // pour pouvoir afficher le retour même si
    mcOpen = false; draft = '';                     // le moteur a déjà clos la partie
    var delta = r.points ? r.points : (r.lost ? -r.lost : 0);
    feedback = { good: !!r.correct, text: text, delta: delta };
    if (r.correct) sfx.good();
    else if (r.demoted) sfx.demote();
    else if (r.mode === 'timeout') sfx.timeout();
    else if (r.event === 'resetToFirst') sfx.heart();
    else sfx.bad();
    if (r.bonus) setTimeout(sfx.bonus, 420);
    saveSeen(game.mode, game.seen);   // mémoire des questions vues, d'une partie à l'autre
    autoSave();                   // et sauvegarde de la partie en cours
    render();
    setTimeout(function () {
      feedback = null; revealed = null;
      if (game.finished) return finishGame();
      if (game.mode === 'bac' && (r.event === 'levelUp' || r.event === 'demoted')) {
        game.__bonusShown = r.bonus || null;
        mapNote = r.event === 'demoted' ? 'demote' : null;
        view = 'map';
        if (r.event === 'levelUp') sfx.levelup();
        runReveal(r.event === 'demoted' ? game.levelIndex + 1 : Math.max(0, game.levelIndex - 1), game.levelIndex);
        return;
      }
      startTimer(); render();
    }, r.correct ? 1000 : 4200);          // deux secondes de plus pour lire la bonne réponse
  }

  /** Fin de partie : on enregistre le score, puis diplôme ou écran de fin. */
  function finishGame() {
    stopTimer();
    if (game.defi) return terminerDefi(false);      // un défi a sa propre résolution
    if (game.__submitted) {                         // déjà fait : on ne réenregistre pas
      view = game.mode === 'detente' ? 'endRelax' : (game.won ? 'diploma' : 'endBac');
      return render();
    }
    game.__submitted = true;
    S.clearSlot();                // la partie est terminée : plus rien à reprendre
    // enregistrement et son isolés : s'ils échouent, l'écran de fin s'affiche quand même
    try {
      saveSeen(game.mode, game.seen);
      S.submit({
        pseudo: S.getPseudo(), score: game.score, mode: game.mode === 'bac' ? 'bac' : 'detente',
        level: game.mode === 'bac' ? ALL_LEVELS[Math.min(game.levelIndex, ALL_LEVELS.length - 1)] : null,
        seconds: E.progress(game).spent
      });
    } catch (e) { /* score non enregistré, la partie reste jouable */ }
    try { sfx.win(); } catch (e) { /* son indisponible */ }
    view = game.mode === 'detente' ? 'endRelax' : (game.won ? 'diploma' : 'endBac');
    render();
  }

  function startTimer() {
    stopTimer();
    if (!game || game.finished) return;
    var last = Date.now();
    tick = setInterval(function () {
      if (!game || game.finished || !game.current || view !== 'play') { stopTimer(); return; }
      var now = Date.now(); game.timeLeft -= (now - last) / 1000; last = now;
      if (game.timeLeft <= 0) { game.timeLeft = 0; stopTimer(); return onTimeout(); }
      var bar = document.querySelector('.timer > i'), lbl = document.querySelector('.timer + .between small');
      if (bar) {
        bar.style.width = (game.timeLeft / game.config.timerSeconds * 100) + '%';
        bar.parentNode.className = 'timer ' + (game.timeLeft <= 5 ? 'crit' : (game.timeLeft <= 10 ? 'low' : ''));
      }
      if (lbl) lbl.textContent = Math.ceil(game.timeLeft) + ' s';
    }, 100);
  }
  function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }

  // ------------------------------------------------------------------ dictée
  function dictate() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('La dictée n\'est pas disponible dans ce navigateur.\nDans l\'app mobile, elle utilisera le moteur natif iOS / Android.'); return; }
    var rec = new SR();
    var subject = game.mode === 'bac' ? E.progress(game).subject : '';
    rec.lang = subject === 'Anglais' ? 'en-US' : 'fr-FR';
    rec.interimResults = false; rec.maxAlternatives = 1;
    recognizing = true; render();
    rec.onresult = function (e) { draft = e.results[0][0].transcript; recognizing = false; render(); };
    rec.onerror = rec.onend = function () { if (recognizing) { recognizing = false; render(); } };
    rec.start();
  }

  // sur téléphone, passer l'app en arrière-plan met le chrono en pause plutôt que de le laisser
  // filer : au retour, le joueur reprend là où il en était
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopTimer(); return; }
    if (view === 'play' && game && !game.finished && game.current && !feedback) startTimer();
  });

  S.flush();          // envoie les scores restés en attente
  render();
})();
</script>
